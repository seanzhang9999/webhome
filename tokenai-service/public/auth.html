<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 TokenAI 财务工作台</title><style>body{font:16px/1.6 system-ui;background:#eef2f6;color:#233145;padding:28px}main{max-width:380px;margin:40px auto;background:white;padding:28px;border-radius:16px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c8d4e3;border-radius:8px;font:inherit}button{background:#355fbe;color:white;cursor:pointer}#error{color:#a42434}small{color:#63748a}</style><main><h1>TokenAI</h1><p>登录报销费控工作台</p><form id="login"><label>财务账号<input name="username" autocomplete="username" required maxlength="120"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">登录并连接事项</button></form><p id="error" role="alert"></p><small>账号由管理员开通。登录授权仅发送给发起登录的受信任页面。</small></main><script src="/auth.js"></script></html>
