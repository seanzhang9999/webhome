server {
    listen 80;
    listen [::]:80;
    server_name tokenai.awiki.info;
    return 301 https://tokenai.awiki.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tokenai.awiki.info;
    ssl_certificate /etc/nginx/ssl/awiki.info.pem;
    ssl_certificate_key /etc/nginx/ssl/awiki.info.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:19320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
