    function renderAwiki(){const d=awikiData[state.awiki];return `<div class="simple"><aside class="subnav"><div class="title"><h2>AWiki</h2><p>发现外部知识与能力</p></div><div class="tabs">${[['communities','社区'],['agents','Agent'],['services','服务'],['solutions','方案']].map(x=>`<button class="${state.awiki===x[0]?'on':''}" data-awiki="${x[0]}">${x[1]}</button>`).join('')}</div></aside><main class="main"><header><span class="eyebrow">AWIKI DISCOVERY</span><h1>${{communities:'社区',agents:'Agent',services:'专业服务',solutions:'方案'}[state.awiki]}</h1><p>发现后可加入、连接或安装；结果仍在对应对象类型中管理。</p></header><div class="feed">${d.map(x=>`<article class="feed-row"><i>${x[0]}</i><span><b>${x[1]}</b><span>${x[2]}</span></span><button class="btn" data-toast="已加入并打开：${x[1]}">加入并查看</button></article>`).join('')}</div></main>${partner('AWiki发现',`我可以结合当前外贸事项，解释这些${{communities:'社区',agents:'Agent',services:'服务',solutions:'方案'}[state.awiki]}是否值得加入或安装。`)}</div>`}
    function renderSettings(){const packageMode=state.settings==='package';return `<div class="simple"><aside class="subnav"><div class="title"><h2>设置</h2><p>基础能力与安装包扩展分开</p></div><button class="${!packageMode?'on':''}" data-setting="base"><span>AWiki Me 基础设置</span><span>›</span></button><button class="${packageMode?'on':''}" data-setting="package"><span>外贸服务包设置</span><span>›</span></button></aside><main class="main"><header><span class="eyebrow">${packageMode?'INSTALLED PACKAGE':'AWIKI ME BASE'}</span><h1>${packageMode?'外贸询盘与履约协同':'身份、沟通与安全'}</h1><p>${packageMode?'只管理外贸包追加的工作对象、Agent、专业服务和业务规则。':'不安装任何方案也完整可用的身份、消息、一览、连接、AWiki与伙伴能力。'}</p></header><div class="grid">${(packageMode?[['事项模板','询盘、订单、履约与复盘'],['Agent与服务','撮合、报价、合同、报关、收款'],['业务规则','报价权限、付款政策、共享边界'],['运行记录','授权投影、执行状态与Receipt']]:[['身份与工作域','陈璐 · 澜海出口业务经理'],['消息与通知','会话、群聊、提醒与未读'],['一览规则','Inbox、动态、待我处理'],['连接与授权','人员、群组、Agent、应用与服务'],['AWiki伙伴','私人分析、摘要、提醒与起草'],['数据与安全','设备、导出、保留与审计']]).map(x=>`<article class="tile"><h3>${x[0]}</h3><p>${x[1]}</p><div class="card-actions"><button class="btn" data-toast="已打开${x[0]}">配置</button></div></article>`).join('')}</div></main>${partner('设置',packageMode?'当前是外贸服务包配置，不改变AWiki Me基础能力。':'当前是AWiki Me基础设置。外贸专业能力由已安装服务包追加。')}</div>`}
    function modal(){if(!state.modal)return '';if(state.modal==='risk')return `<div class="overlay" data-close><section class="modal"><header class="modal-head"><div><span class="eyebrow">PROFESSIONAL AI SERVICE · CONTROLLED PREVIEW</span><h2>企业尽调与交易风险报告</h2></div><button class="btn" data-close>关闭</button></header><div class="modal-body"><div class="report"><nav class="report-nav"><button class="on">综合结论</button><button>主体信息</button><button>司法与信用</button><button>制裁与负面名单</button><button>关联关系</button><button>证据与数据源</button></nav><main class="report-main"><div class="report-title"><div><span class="eyebrow">NORDLICHT RETAIL GMBH</span><h2 style="margin:4px 0">建议：有条件推进</h2><p style="margin:0;color:var(--muted);font-size:10px">主体真实、存续正常，未命中制裁；需补充实际控制人声明，并保持预付款条件。</p></div><div class="score">72</div></div><div class="risk-grid"><div><small>工商主体</small><b>已验证</b></div><div><small>司法/信用</small><b>低风险</b></div><div><small>制裁筛查</small><b>未命中</b></div><div><small>付款建议</small><b>30/70 T/T</b></div><div><small>信用敞口</small><b>不建议赊销</b></div><div><small>报告编号</small><b>FT-RISK-0907</b></div></div><section class="finding"><b>需关注 · 控制人材料</b><p>公开信息可以确认管理层与注册地址，但实际控制人声明尚未作为本次询盘附件提供。建议在合同签署前补齐。</p></section><section class="finding"><b>可接受 · 司法与负面信息</b><p>发现两项历史商业纠纷，均已结案；未发现失信执行、重大行政处罚或制裁名单命中。</p></section><section class="finding"><b>AWiki伙伴如何使用</b><p>专业服务提供核验和证据定位；伙伴结合当前询盘、付款政策和订单金额转成“有条件推进”的业务建议；最终决定仍由陈璐作出。</p></section></main></div></div></section></div>`;
      const title=state.modal==='identity'?'固定身份与工作域':state.modal==='participants'?'参与者列表':state.modal==='profile'?'联系人资料':'详情';return `<div class="overlay" data-close><section class="modal" style="width:min(720px,100%)"><header class="modal-head"><h2>${title}</h2><button class="btn" data-close>关闭</button></header><div class="modal-body"><div class="identity-layout">${state.modal==='identity'?`<article class="identity-card"><span class="eyebrow">CURRENT IDENTITY</span><h3>陈璐 · 外贸业务经理</h3><p>宁波澜海生活科技有限公司（虚构）</p><span class="pill ok">组织身份已验证</span></article><article class="identity-card"><h3>固定演示视角</h3><p>所有判断、私人伙伴建议和人员决定均从中国出口供货方视角呈现，不切换为境外买方。</p><span class="pill purple">供给方工作域</span></article>`:state.modal==='participants'?`<article class="identity-card"><h3>本方参与者</h3><p>陈璐 · 负责人<br>王璐 · 外贸助理<br>机会响应Agent · 受指派执行</p></article><article class="identity-card"><h3>外部与服务方</h3><p>Martin Roth · 买方采购经理<br>Buyer Agent · 需求方Agent<br>企业信用评估服务 · 本轮受控调用</p></article>`:`<article class="identity-card"><h3>${sessions[state.message].title}</h3><p>${sessions[state.message].sub}<br>已验证联系关系 · 最近沟通 09:21</p></article><article class="identity-card"><h3>关联工作事项</h3><p>德国买方 · 50,000只保温杯询盘<br>订单 LH-NL-2026-0912 · 履约</p></article>`}</div></div></section></div>`}
    function render(){document.querySelectorAll('.overlay').forEach(x=>x.remove());document.getElementById('rail').innerHTML=rail();document.getElementById('workspace').innerHTML=state.route==='work'?renderWork():state.route==='messages'?renderMessages():state.route==='overview'?renderOverview():state.route==='connections'?renderConnections():state.route==='awiki'?renderAwiki():renderSettings();document.querySelector('.app').insertAdjacentHTML('beforeend',modal());requestAnimationFrame(scrollBottom)}
    function scrollBottom(){document.querySelectorAll('.chat-body,.partner-body').forEach(x=>x.scrollTop=x.scrollHeight)}let toastTimer;function toast(x){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=x;t.classList.add('on');toastTimer=setTimeout(()=>t.classList.remove('on'),1800)}
    document.addEventListener('click',e=>{if(e.target.classList.contains('overlay')||e.target.closest('[data-close]')){state.modal=null;render();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.route&&!b.dataset.matter){state.route=b.dataset.route;render();return}if(b.dataset.modal){state.modal=b.dataset.modal;render();return}if(b.dataset.workTab){state.workTab=b.dataset.workTab;render();return}if(b.dataset.matter){state.matter=b.dataset.matter;state.workTab='matters';if(b.dataset.route)state.route=b.dataset.route;render();return}if(b.dataset.session){state.message=b.dataset.session;render();return}if(b.dataset.overview){state.overview=b.dataset.overview;render();return}if(b.dataset.connection){state.connection=b.dataset.connection;render();return}if(b.dataset.awiki){state.awiki=b.dataset.awiki;render();return}if(b.dataset.setting){state.settings=b.dataset.setting;render();return}if(b.dataset.next!==undefined){const m=matters[state.matter];if(m.next){state.matter=m.next;state.step=Math.min(4,state.step+1);render();toast('已按上游回单接续到下一事项')}else toast('已生成订单复盘草稿');return}if(b.dataset.send!==undefined){const i=document.getElementById('matterInput');if(i?.value.trim()){state.manual.push(i.value.trim());render();toast('已写入当前事项群')}return}if(b.dataset.sessionSend!==undefined){const i=document.getElementById('sessionInput');if(i?.value.trim()){sessions[state.message].msgs.push(['me','陈璐',i.value.trim()]);render();toast('已发送到当前会话')}return}if(b.dataset.partnerSend!==undefined){const i=document.getElementById('partnerInput');if(i?.value.trim()){state.partnerTurns.push(i.value.trim());render();toast('伙伴已在私人工作面响应')}return}if(b.dataset.toast){toast(b.dataset.toast)}});
    document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='matterInput')document.querySelector('[data-send]')?.click();if(e.target.id==='sessionInput')document.querySelector('[data-session-send]')?.click();if(e.target.id==='partnerInput')document.querySelector('[data-partner-send]')?.click()});
    render();
  })();
  </script>
