      const title=state.modal==='identity'?'固定身份与工作域':state.modal==='participants'?'参与者列表':state.modal==='profile'?'联系人资料':'详情';return `<div class="overlay" data-close><section class="modal" style="width:min(720px,100%)"><header class="modal-head"><h2>${title}</h2><button class="btn" data-close>关闭</button></header><div class="modal-body"><div class="identity-layout">${state.modal==='identity'?`<article class="identity-card"><span class="eyebrow">CURRENT IDENTITY</span><h3>陈璐 · 外贸业务经理</h3><p>宁波澜海生活科技有限公司（虚构）</p><span class="pill ok">组织身份已验证</span></article><article class="identity-card"><h3>固定演示视角</h3><p>所有判断、私人伙伴建议和人员决定均从中国出口供货方视角呈现，不切换为境外买方。</p><span class="pill purple">供给方工作域</span></article>`:state.modal==='participants'?`<article class="identity-card"><h3>本方参与者</h3><p>陈璐 · 负责人<br>王璐 · 外贸助理<br>机会响应Agent · 受指派执行</p></article><article class="identity-card"><h3>外部与服务方</h3><p>Martin Roth · 买方采购经理<br>Buyer Agent · 需求方Agent<br>企业信用评估服务 · 本轮受控调用</p></article>`:`<article class="identity-card"><h3>${sessions[state.message].title}</h3><p>${sessions[state.message].sub}<br>已验证联系关系 · 最近沟通 09:21</p></article><article class="identity-card"><h3>关联工作事项</h3><p>德国买方 · 50,000只保温杯询盘<br>订单 LH-NL-2026-0912 · 履约</p></article>`}</div></div></section></div>`}
    function render(){document.querySelectorAll('.overlay').forEach(x=>x.remove());document.getElementById('rail').innerHTML=rail();document.getElementById('workspace').innerHTML=state.route==='work'?renderWork():state.route==='messages'?renderMessages():state.route==='overview'?renderOverview():state.route==='connections'?renderConnections():state.route==='awiki'?renderAwiki():renderSettings();document.querySelector('.app').insertAdjacentHTML('beforeend',modal());requestAnimationFrame(scrollBottom)}
    function scrollBottom(){document.querySelectorAll('.chat-body,.partner-body').forEach(x=>x.scrollTop=x.scrollHeight)}let toastTimer;function toast(x){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=x;t.classList.add('on');toastTimer=setTimeout(()=>t.classList.remove('on'),1800)}
    function completeFlow(){const f=currentFlow();if(!f.current)return;const finished=f.current;if(finished.unlock)state.flow[finished.unlock]=0;state.flow[state.matter]+=1;state.modal=null;render();toast(finished.unlock?`已写回回单并解锁「${matters[finished.unlock].title}」`:`${finished.phase}步骤已完成，结果已写回事项`)}
    document.addEventListener('click',e=>{if(e.target.classList.contains('overlay')||e.target.closest('button[data-close]')){state.modal=null;render();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.flowComplete!==undefined){completeFlow();return}if(b.dataset.route&&!b.dataset.matter){state.route=b.dataset.route;render();return}if(b.dataset.modal){state.modal=b.dataset.modal;render();return}if(b.dataset.workTab){state.workTab=b.dataset.workTab;render();return}if(b.dataset.matter){if(!unlocked(b.dataset.matter)){toast('该事项需要等待上游人员决定和Receipt');return}state.matter=b.dataset.matter;state.workTab='matters';if(b.dataset.route)state.route=b.dataset.route;render();return}if(b.dataset.session){state.message=b.dataset.session;render();return}if(b.dataset.overview){state.overview=b.dataset.overview;state.overviewItem=0;render();return}if(b.dataset.overviewItem!==undefined){state.overviewItem=Number(b.dataset.overviewItem)||0;render();return}if(b.dataset.connection){state.connection=b.dataset.connection;state.connectionItem=0;render();return}if(b.dataset.connectionItem!==undefined){state.connectionItem=Number(b.dataset.connectionItem)||0;render();return}if(b.dataset.awiki){state.awiki=b.dataset.awiki;state.awikiItem=0;render();return}if(b.dataset.awikiItem!==undefined){state.awikiItem=Number(b.dataset.awikiItem)||0;render();return}if(b.dataset.setting){state.settings=b.dataset.setting;render();return}if(b.dataset.send!==undefined){const i=document.getElementById('matterInput');if(i?.value.trim()){(state.manual[state.matter]??=[]).push(i.value.trim());render();toast('已写入当前事项群')}return}if(b.dataset.sessionSend!==undefined){const i=document.getElementById('sessionInput');if(i?.value.trim()){sessions[state.message].msgs.push(['me','陈璐',i.value.trim()]);render();toast('已发送到当前会话')}return}if(b.dataset.partnerSend!==undefined){const i=document.getElementById('partnerInput');if(i?.value.trim()){state.partnerTurns.push(i.value.trim());render();toast('伙伴已在私人工作面响应')}return}if(b.dataset.toast){toast(b.dataset.toast)}});
    document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='matterInput')document.querySelector('[data-send]')?.click();if(e.target.id==='sessionInput')document.querySelector('[data-session-send]')?.click();if(e.target.id==='partnerInput')document.querySelector('[data-partner-send]')?.click()});
    render();
  })();
