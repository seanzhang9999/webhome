let s=load(),view='work',workTab='matters',selected=s.created.includes(E[s.cursor].g)?E[s.cursor].g:0,objectIndex=0,sideTab='updates',auxTab='people',modal=null,partnerOpen=false,toast='',toastTimer=null,search='',boardChoice='',noteInput='',operatorName='王工（模拟）';

function workObjects(){if(workTab==='matters')return s.created.map(id=>({id,mark:GROUPS[id].tag.slice(0,1),name:GROUPS[id].name,sub:GROUPS[id].short,group:id,tag:id===E[s.cursor].g?'当前事项':'已交接'}));

if(workTab==='topics')return [{id:'topic-process',name:'PET聚酯弹性体技术路线',sub:'跨事项积累机理、指标和样品知识',mark:'专',topic:'process'},{id:'topic-experiment',name:'实验质量与数据回流',sub:'持续追踪实验、异常、模型回流',mark:'专',topic:'experiment'}];
return [{id:'solution',name:'材数智元 · 材料科研协同',sub:'已安装方案 · L0–L7 能力/模板/规则',mark:'方',solution:true}];}

function leftWork(){const obs=workObjects(),matches=obs.filter(x=>x.name.includes(search)||x.sub.includes(search));return `<aside class="left-pane"><div class="pane-title"><h2>工作</h2><p>从事项协同开始，按需要交接与沉淀</p></div><nav class="work-tabs" aria-label="工作对象">${Object.entries(NAMES).map(([k,v])=>`<button type="button" data-worktab="${k}" class="${workTab===k?'active':''}" aria-current="${workTab===k?'page':'false'}">${v}</button>`).join('')}</nav><label class="search">⌕ <input id="workSearch" value="${esc(search)}" placeholder="搜索${NAMES[workTab]}" aria-label="搜索${NAMES[workTab]}"></label><div class="items">${matches.length?matches.map((x)=>`<button class="obj ${(workTab==='matters'?selected===x.group:objectIndex===obs.indexOf(x))?'active':''}" data-object="${obs.indexOf(x)}" type="button"><span class="avatar ${x.board?'board':'matter'}">${esc(x.mark)}</span><span class="obj-text"><b>${esc(x.name)}</b><span>${esc(x.sub)}</span><em>${x.tag||'查看详情 →'}</em></span></button>`).join(''):'<div class="empty">暂无符合条件的项目</div>'}</div><div class="list-foot">${{matters:'事项是动态建立的人机混合群；具体交接需要时才创建 Board。',resources:'资源来自事项与实际创建的 Board，保留出处。',topics:'专题跨事项累积知识，不负责单次任务执行。',solutions:'方案配置专业能力和模板，不替代事项群。'}[workTab]}</div></aside>`;}
function currentRecord(e){return `<article class="msg ${ACTORS[e.actor].kind==='me'?'mine':''} ${e.risk?'risk':''} ${ACTORS[e.actor].kind==='agent'?'agentmsg':''} ${e.actor==='system'?'systemmsg':''}" id="event-${esc(e.id)}">${avatar(e.actor)}<div class="msgcontent"><div class="metadata"><strong>${esc(ACTORS[e.actor].name)}</strong><span>${esc(ACTORS[e.actor].role)}</span><time>${esc(e.time)}</time></div><div class="bubble"><strong>${esc(e.title)}</strong><p>${esc(e.text)}</p>${e.doc?`<button class="attachment" data-source="${e.doc}" type="button">▤ ${esc(SOURCES[e.doc].title)} ↗</button>`:''}</div><div class="proof">${esc(e.id)} · ${esc(e.lvl||'协同')} · 预置模拟消息</div></div></article>`;}
function boardReceipt(event){let b=s.boards[event.gate];if(!b||b.status!=='confirmed')return '';const label=b.choice==='original'?'按原始需求确认':b.choice==='v02'?'采用V0.2建议':b.choice==='hold'?'暂不冻结参数':'批准交接';return `<div class="receipt"><strong>✓ ${esc(BOARDS[event.gate].title)} · 已写回事项</strong><div>${esc(label)} · 操作主体：${esc(b.actor)} · 范围：${esc(BOARDS[event.gate].scope)}</div><p>回单已关联本次任务，而不是代替整个事项。</p><button class="attachment board" data-openboard="${event.gate}" type="button">▣ 打开 Board 回单 ↗</button><div class="proof">BOARD-${esc(event.gate.toUpperCase())} · 演示确认 · 非真实签名</div></div>`;}

if(g==='execute')return `<div class="advance"><span class="pill amber">L6 · 执行路由选择</span><strong>标准任务卡已签收，等待执行路径与证据回单</strong><p>可以走人工实验员或模拟设备适配器。此Demo不连接PLC、仪器API或真实实验环境。</p><div class="actions">${btn('打开本次实验操作卡','execution','primary')}</div></div>`;

function solutionBody(){return `<div class="eyebrow">WORK / SOLUTION · INSTALLED PACK</div><h1>材数智元 · 材料科研协同</h1><p>专业方案负责 L0–L7、角色模板、输出契约和科研规则。它不是 AWiki 的一级功能，也不直接代替动态建立的科研事项群。</p><div class="metric-row"><div class="metric"><b>8</b><span>科研专业模块</span></div><div class="metric"><b>${s.created.length}</b><span>当前已创建事项</span></div><div class="metric"><b>${Object.keys(s.boards).length}</b><span>按需交接 Board</span></div></div><h2>从需求理解到结果回流</h2><div class="module-strip">${['L0 需求/增强','L1 筛选','L2 机理','L3 决策','L4 规划','L5 方案','L6 操作','L7 回流'].map(m=>`<span class="module">${m}</span>`).join('')}</div><div class="tile" style="margin-bottom:13px"><h3>L模块如何交接 · 输入/输出/人员关口</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>模块</th><th>输入</th><th>输出工件</th><th>人的作用</th></tr></thead><tbody>${MODULE_IO.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table></div><p class="note">这份表属于「工作→方案」的专业流程配置，具体执行仍由动态事项群承接；数据回流不是一条不可返回的流水线。</p></div><div class="grid"><div class="tile"><h3>专业知识与数据</h3><p>CaiMat-L1、材料数据资源、知识检索与材料机理；数据底座规模为项目方描述，尚未在Demo验证。</p>${btn('查看数据来源','source:data','mini')}</div><div class="tile"><h3>模板与交接规则</h3><p>需求澄清、技术方案、实验任务、人工/设备执行及下一轮规划等模板；跨群最小授权快照。</p>${btn('查看TC-01任务卡','source:tc01','mini')}</div><div class="tile"><h3>动态建立事项</h3><p>并非一开始预建8个智能体聊天室。每项工作基于上一项具体批准及回单，按需要创建人机混合群。</p></div><div class="tile"><h3>Board 与 AI 伙伴</h3><p>Board来自某次交接或共同确认；AI伙伴作为私人助手，帮助人理解、执行与提供规范但自然的反馈。</p></div><div class="tile wide"><h3>AI 学徒 → 授权自治的演进（方案策略，不是自动授予权限）</h3><p><b>第一阶段：</b>以人工接受任务为主，AI辅助检索、生成建议、步骤核对和回单整理。 <b>第二阶段：</b>经专业人员验证后，部分任务可经授权的设备适配器执行；异常、越界和合规签字继续交人。不同L模块与设备可有不同自治等级。</p></div></div><h2>演示入口</h2>${btn('进入当前研发事项','current','primary')} ${btn('查看材料研发流程来源','source:flow')}`;}

function modalBoard(key){const d=BOARDS[key],b=s.boards[key],isDone=b?.status==='confirmed',selectedChoice=isDone?b.choice:boardChoice;return `<div class="modal-head"><div><div class="eyebrow">BOARD / TASK-SPECIFIC SHARED ARTIFACT</div><h2>${esc(d.title)}</h2></div><button class="btn mini" data-action="close" aria-label="关闭">✕</button></div><div class="modal-main"><span class="board-tag">▣ ${esc(d.kind)} · ${isDone?'已确认':'待确认'}</span><p>只有发生具体交接、职责澄清或共同验收需求时才建立这份 Board。其确认记录写回来源事项，不会替代群聊。</p><div class="info-kv"><span>交接责任</span><span>${esc(d.owner)}</span></div><div class="info-kv"><span>证据来源</span><span>${esc(d.source)}</span></div><div class="info-kv"><span>共享范围</span><span>${esc(d.scope)}</span></div><h3 style="margin-top:16px">${esc(d.question)}</h3>${d.choices.map(c=>`<label class="radio-row"><input type="radio" name="board-choice" value="${esc(c.id)}" ${selectedChoice===c.id?'checked':''} ${isDone?'disabled':''}/><span><b>${esc(c.title)}</b><small>${esc(c.desc)}</small></span></label>`).join('')}${key==='spec'&&selectedChoice==='hold'?'<div class="warning-line">保持未确认时，后续研发仅能把温度条件作为待定，不得使用“客户已批准V0.2”的说法。</div>':''}<div class="note">签名及DID身份在此仅为模拟标识；没有进行真实跨域数字签名、事实核验或远程通知。</div>${modal?.error?`<div class="error-line">${esc(modal.error)}</div>`:''}</div><div class="modal-actions">${btn('取消 / 返回事项','close')}${isDone?btn('已确认 · 关闭','close','primary'):btn('确认并写回来源事项','confirm-board','primary')}</div>`;}

function resetModal(){return `<div class="modal-head"><div><div class="eyebrow">RESET / LOCAL DEMO</div><h2>确认重新开始演示？</h2></div>${btn('✕','close','mini')}</div><div class="modal-main"><div class="warning-line"><b>建议先导出当前记录。</b><br>重置会清空本地事项进度、已创建Board、人员接受记录、模拟实验回单和演示备注，不能撤销。</div><p>此操作只影响本地浏览器；不删除或修改 GitHub 项目、源文件或任何真实系统数据。</p></div><div class="modal-actions">${btn('先导出状态','export','')}${btn('取消，保留现状','close')}${btn('确认重置演示','confirm-reset','danger')}</div>`;}
function modalHtml(){if(!modal)return '';let inner=modal.type==='board'?modalBoard(modal.key):modal.type==='members'?membersModal():modal.type==='accept'?acceptModal():modal.type==='exec'?execModal():resetModal();return `<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${modal.type==='board'?'交接 Board':modal.type==='exec'?'实验执行':modal.type==='accept'?'任务接收':'演示操作'}">${inner}</section></div>`;}
function render(scroll=false){const main=view==='work'?(workTab==='matters'?conversation():workSecondary()):auxiliary();$('app').innerHTML=rail()+`<div class="workspace">${main}${modalHtml()}${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}</div>`;if(scroll){const el=$('chatScroll');if(el)el.scrollTop=el.scrollHeight;}}
function showModal(type,key){modal={type,key,error:''};boardChoice=s.boards[key]?.choice||'';render();}
function createBoard(key){if(!BOARDS[key])return;const b=s.boards[key];if(!b){s.boards[key]={status:'draft',choice:'',actor:'',origin:E[s.cursor]?.id||'work',version:1};save();}showModal('board',key);}
function confirmBoard(){const k=modal?.key,b=s.boards[k],d=BOARDS[k];if(!k||!d||!b)return;if(!boardChoice){modal.error='需要明确选择交接结论，不能把沉默当作确认。';render();return;}if(boardChoice==='hold'&&k!=='spec'){modal.error='目前选择暂缓交接。请取消返回事项，或明确批准后再继续。';render();return;}
b.choice=boardChoice;b.status='confirmed';b.actor=k==='spec'?'张研（模拟代客户确认；真实客户须复核）':k==='result-handoff'?'周博士与张研（模拟）':'张研（模拟项目负责人）';b.confirmedAt='D'+(s.cursor<7?'1':s.cursor<11?'2':'3')+' · 演示确认';s.decisions.push({event:E[s.cursor].id,board:k,choice:boardChoice});if(k==='spec')s.spec=boardChoice;save();modal=null;notify(`已将「${d.title}」的确认回单写回当前事项。`);}
function confirmAccept(){const t=$('humanReply')?.value.trim()||'';if(t.length<12){modal.error='需要保留清楚、可追溯的任务接收反馈。';render();return;}s.accepted=true;s.notes.push({kind:'group',g:2,text:'王工（模拟具名接单）：'+t});s.decisions.push({event:E[s.cursor].id,type:'human_accept'});save();modal=null;notify('实验员已在本群模拟接单；尚未开始真实实验。');}
function confirmExec(){if(s.runMode==='manual'){if(!CHECKS.every(x=>s.checks[x[0]])){modal.error='请先逐条核对演示操作检查项，再形成回单。';render();return;}operatorName=$('operatorName')?.value.trim()||'';if(!operatorName){modal.error='记录执行人不可为空。';render();return;}}else if(!s.deviceAuthorized){modal.error='模拟设备路径必须先明确授权范围和非真实控制性质。';render();return;}
s.execution={mode:s.runMode,operator:s.runMode==='manual'?operatorName:'实验室 Agent / 模拟适配器',samples:TEST_RESULTS,provenance:'SYNTHETIC_DEMO',safety:'No hardware calls; simulated record only',timestamp:'D2 15:00 (virtual)'};s.decisions.push({event:E[s.cursor].id,type:'execution_receipt',mode:s.runMode});save();modal=null;notify('已保存明确标记的虚构实验回单；请继续查看 L7 评价。');}
function downloadState(){const payload={notice:'仅演示数据；不包含真实实验或数字签名',exportedAt:new Date().toISOString(),...s};const data=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const uri=URL.createObjectURL(data);const a=document.createElement('a');a.href=uri;a.download='awiki-pet-demo-state.json';a.click();setTimeout(()=>URL.revokeObjectURL(uri),1000);toast='状态已准备导出，可在浏览器下载列表中查看。';render();}
function goCurrent(){view='work';workTab='matters';selected=E[s.cursor].g;objectIndex=0;search='';partnerOpen=false;render(true);}
function jumpToEvent(i){if(!Number.isInteger(i)||i<0||i>s.cursor)return;view='work';workTab='matters';selected=E[i].g;objectIndex=0;partnerOpen=false;render();const el=$('event-'+E[i].id);if(el)el.scrollIntoView({block:'center',behavior:'instant'});}
function action(name){if(name==='close'||name==='hidepartner'){if(name==='close')modal=null;else partnerOpen=false;render();return;}if(name==='showpartner'){partnerOpen=true;render();return;}
if(name==='next'){proceed();return;}if(name==='current'){goCurrent();return;}if(name==='members'){showModal('members');return;}if(name==='pause-hint'){notify('已保留当前状态。尚无确认回单，不会自动推进。');return;}if(name.startsWith('openboard:')){createBoard(name.split(':')[1]);return;}if(name==='confirm-board'){confirmBoard();return;}if(name==='accept-task'){showModal('accept');return;}if(name==='confirm-accept'){confirmAccept();return;}if(name==='execution'){showModal('exec');return;}if(name==='confirm-exec'){confirmExec();return;}if(name==='export'){downloadState();return;}if(name==='reset'){showModal('reset');return;}if(name==='confirm-reset'){s=DEFAULT();save();modal=null;toast='本地演示状态已重置。';goCurrent();return;}
if(name.startsWith('group:')){const i=Number(name.split(':')[1]);if(!s.created.includes(i))return;view='work';workTab='matters';selected=i;render();return;}
if(name.startsWith('sourceevent:')){jumpToEvent(Number(name.split(':')[1]));return;}if(name.startsWith('source:')){view='work';workTab='resources';objectIndex=Math.max(0,workObjects().findIndex(x=>x.source===name.split(':')[1]));render();return;}if(name==='solution'){view='work';workTab='solutions';objectIndex=0;render();return;}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;partnerOpen=false;modal=null;auxTab=({messages:'chat',overview:'updates',connections:'people',awiki:'discover',settings:'main'})[view]||'';if(view==='work'){workTab='matters';selected=E[s.cursor].g;}render();return;}
const tab=e.target.closest('[data-worktab]');if(tab){workTab=tab.dataset.worktab;objectIndex=0;search='';partnerOpen=false;render();return;}
const item=e.target.closest('[data-object]');if(item){const i=Number(item.dataset.object);if(workTab==='matters')selected=workObjects()[i].group;else objectIndex=i;partnerOpen=false;render();return;}
const aux=e.target.closest('[data-auxtab]');if(aux){auxTab=aux.dataset.auxtab;render();return;}
const doc=e.target.closest('[data-source]');if(doc){const id=doc.dataset.source;view='work';workTab='resources';objectIndex=Math.max(0,workObjects().findIndex(x=>x.source===id));render();return;}
const openb=e.target.closest('[data-openboard]');if(openb){createBoard(openb.dataset.openboard);return;}
const mode=e.target.closest('[data-mode]');if(mode){s.runMode=mode.dataset.mode;save();render();return;}
const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return;}
if(e.target.matches('[data-backdrop]')){modal=null;render();return;}
});
document.addEventListener('change',e=>{if(e.target.name==='board-choice'){boardChoice=e.target.value;if(modal)modal.error='';render();return;}
if(e.target.matches('[data-check]')){s.checks[e.target.dataset.check]=e.target.checked;save();/* avoid rerender to preserve focus */return;}
if(e.target.matches('[data-device-auth]')){s.deviceAuthorized=e.target.checked;save();return;}
});
document.addEventListener('submit',e=>{if(e.target.id==='groupForm'||e.target.id==='privateForm'){e.preventDefault();const kind=e.target.id==='groupForm'?'group':'private';const el=e.target.querySelector('input');const t=el.value.trim();if(!t)return;s.notes.push({kind,g:selected,text:t});save();render(true);return;}});
document.addEventListener('input',e=>{if(e.target.id==='workSearch'){search=e.target.value;const start=e.target.selectionStart;const active=e.target; /* filter in place to avoid re-rendering the focused input */ document.querySelectorAll('.obj').forEach(n=>{const idx=Number(n.dataset.object);const x=workObjects()[idx];n.hidden=!(x.name.includes(search)||x.sub.includes(search));});}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();return;}if((e.key==='n'||e.key==='N'||e.key==='ArrowRight')&&!e.repeat&&!modal&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&view==='work'&&workTab==='matters'){e.preventDefault();proceed();}});
render(true);
</script>
</body>
</html>
