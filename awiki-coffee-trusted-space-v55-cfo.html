 const before=composerDraft.slice(0,input.selectionStart??composerDraft.length),m=/(?:^|\s)([@&#])([^\s@&#]*)$/.exec(before);
 composerMenu=m?{kind:m[1]==='@'?'actor':m[1]==='#'?'board':'artifact',query:m[2]}:null;
 updateMentionDom();
}
function pickReference(kind,id){
 const candidate=referenceCandidates(kind==='source'?'artifact':kind).find(x=>x.id===id&&x.kind===kind);
 if(!candidate)return notify('该引用对象目前不可访问。');
 if(kind==='board'&&!s.boards[id]&&!ensureBoard(id))return;
 const input=q('#group-text');if(!input)return;
 const prefix=kind==='actor'?'@':kind==='board'?'#':'&',token=prefix+candidate.label;
 const caret=input.selectionStart??input.value.length,before=input.value.slice(0,caret),after=input.value.slice(caret),match=/(?:^|\s)([@&#])([^\s@&#]*)$/.exec(before);
 const start=match?before.length-match[0].length+(match[0].startsWith(' ')?1:0):before.length;
 composerDraft=before.slice(0,start)+token+' '+after;
 if(!composerRefs.some(x=>x.kind===kind&&x.id===id))composerRefs.push({kind,id,label:candidate.label,token});
 composerMenu=null;
 input.value=composerDraft;updateMentionDom();input.focus();
 const next=start+token.length+1;input.setSelectionRange(next,next);
}
function removeReference(index){const r=composerRefs[index];if(!r)return;composerRefs.splice(index,1);composerDraft=composerDraft.replace(r.token,'').replace(/ {2,}/g,' ');const input=q('#group-text');if(input){input.value=composerDraft;input.focus();}updateMentionDom();}
