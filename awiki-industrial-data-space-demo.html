          else if(!cs||cs.phase==="editing"){status="待人员决定";statusClass="warn"}
          else if(cs.phase==="declined"){status="已暂停";statusClass="warn"}

追溯</b></div><strong>${x[2]}</strong></div>`).join("")}</div><div class="notice" style="margin-top:10px"><span>↗</span><span>数字只演示看板结构。真实试点要区分业务成交、SOP 覆盖和 Agent 执行回单。</span></div></article></section></main></div>`;
      }

      const factorySettingInfo={general:["基本与身份","海岳工作域、版本与可携带身份。"],solutions:["已安装方案","方案把数据空间能力组织成具体岗位的 SOP、看板和 Matter。"],collab:["协作规则 / SIDE","SIDE 组织持续协作能力；每次规则修改仍由配置 Matter 保存、审批和发布。"],partner:["AWiki 伙伴","伙伴行为不是一组即时开关，而是可按方案和 Matter 覆盖的版本化规则。"],agents:["Agent 与数据空间服务","数据空间、MES 与数据产品都通过具名 Agent 能力连接，不让用户直接面对底层连接器。"],identity:["身份与授权","主体、能力、字段、用途与有效期共同决定一次协作。"],advanced:["高级运行记录","AIC 只作为 Agent 运行上下文的技术检查器，不作为普通用户主导航。"]};
      function configMatter(kind){const partner=kind==="partner";return `<section class="config-matter"><header class="config-head"><div><h3>配置 Matter · ${partner?'AWiki 伙伴 / 工厂方案':'产业链协同贸易 / SIDE'}</h3><p>CFG-${partner?'PARTNER':'SIDE'}-014 · v1.${partner?'7':'3'} → v1.${partner?'8':'4'} · 等待具名批准</p></div><span class="pill warn">HUMAN CHECK</span></header><div class="config-body"><div class="kv"><span>提议者</span><b>${partner?'陈工 + AWiki 伙伴':'方案管理员 周启明'}</b></div><div class="kv"><span>作用范围</span><b>${partner?'海岳工厂 / 产业链协同贸易 / 喊单与排产 Matter':'产业链协同贸易方案 / 所有新 Matter'}</b></div><div class="config-diff"><article><span>当前版本</span><b>${partner?'只提示风险，不自动起草对外响应':'跨组织发送由业务负责人批准'}</b></article><div class="config-arrow">→</div><article><span>提议变更</span><b>${partner?'允许起草工厂响应；仍须人员点击发送':'新增：Agent 扩大字段必须由数据责任人联签'}</b></article></div><div class="notice" style="margin-top:9px"><span>i</span><span><b>SIDE 不替代配置 Matter：</b>SIDE 是规则的组织视角；配置 Matter 是变更、影响分析、批准、版本和发布 Receipt 的持久对象。</span></div><div class="collab-actions row"><button class="btn primary" data-ind-toast="已生成发布回单预览；演示未真正修改规则">批准并发布新版本</button><button class="btn secondary" data-ind-toast="配置 Matter 保持待讨论">继续讨论影响</button></div></div></section>`}
      function factorySettingsBody(){
        if(state.settings==="general")return `<section class="settings-card"><h2>海岳化工工作域</h2><p>演示版本 v1.2 · 产业数据空间场景包。</p>${[["当前身份","陈工 · 海岳生产计划经理"],["组织 DID","did:anp:haiyue-east"],["语言与地区","简体中文 · 中国标准时间"],["导出","身份、授权与个人配置可携带"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><button class="btn secondary" data-ind-toast="${x[0]}详情">查看</button></div>`).join("")}</section>`;
        if(state.settings==="solutions")return `<section class="settings-card"><h2>产业链协同贸易 · HAHO</h2><p>已为生产计划、销售运营、数据责任与履约岗位安装。</p><div class="detail-grid"><article class="detail-card"><h3>人员工作面</h3><div class="kv"><span>消息 / 事项</span><b>喊单、合作、排产、履约</b></div><div class="kv"><span>一览</span><b>变化、资源、专题与 Inbox</b></div><div class="kv"><span>方案看板</span><b>工厂队列、Agent 班组、协同漏斗</b></div></article><article class="detail-card"><h3>数据空间服务</h3><div class="kv"><span>报送</span><b>供给能力数据产品</b></div><div class="kv"><span>订阅</span><b>可信需求、预测与物流服务</b></div><div class="kv"><span>治理</span><b>DID、最小授权与 Receipt</b></div></article></div></section>`;
        if(state.settings==="collab")return `<section class="settings-card"><h2>SIDE · 四类持续协作能力</h2><p>不是一条固定流程，也不是配置对象本身；它帮助每个 Matter 持续组织资源、思考、行动与评估。</p><div class="side-grid"><article><strong>S</strong><b>Steward Resources</b><p>数据产品、连接、证据和权限。</p></article><article><strong>I</strong><b>Improve Thinking</b><p>差异、风险、备选与依据。</p></article><article><strong>D</strong><b>Drive Action</b><p>人员决定、Agent 指派和写回。</p></article><article><strong>E</strong><b>Evaluate Anytime</b><p>状态、阻塞、Receipt 与 Impact。</p></article></div></section>${configMatter("collab")}`;
        if(state.settings==="partner")return `<section class="settings-card"><h2>伙伴默认行为</h2><p>伙伴分析留在右侧私人层；只有用户明确确认的内容进入中间 Matter。</p>${[["可读范围","当前 Matter + 经授权的历史 Matter 投影"],["可起草","工厂响应、授权决定、汇报与指派草稿"],["不可代办","不可替用户发送、承诺、扩大授权或触发 MES"],["覆盖层级","个人默认 → 方案 → Matter 临时覆盖"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="pill ${x[0]==='不可代办'?'warn':'ok'}">已治理</span></div>`).join("")}</section>${configMatter("partner")}`;
        if(state.settings==="agents")return `<section class="settings-card"><h2>由 Agent 连接数据空间与企业系统</h2><p>人员选择业务能力和授权，不直接配置底层 API / 连接器。</p><div class="agent-bindings"><div class="agent-binding"><i>报</i><span><b>海岳数据报送 Agent</b><span>ERP / MES / DCS → 工厂域证明 → 数据空间数据产品目录</span></span><span class="pill ok">在线</span></div><div class="agent-binding"><i>机</i><span><b>海岳机会响应 Agent</b><span>数据空间匹配邀请 → 工厂人员 → 签名响应</span></span><span class="pill ok">已连接</span></div><div class="agent-binding"><i>配</i><span><b>公共供需匹配 Agent</b><span>可信需求产品 + 供给能力产品 → 候选邀请 Receipt</span></span><span class="pill">公共服务</span></div><div class="agent-binding"><i>排</i><span><b>海岳智能排产 Agent</b><span>已确认合作结果 → 内部计划 → MES 草稿区</span></span><span class="pill gray">待派生</span></div></div></section><section class="settings-card"><h2>为什么不直接连数据空间</h2><p>Agent 把底层数据产品、身份、用途和回单转成岗位可用的“接单、报送、排产”能力；每次调用仍由 Matter 授权和记录。</p></section>`;
        if(state.settings==="identity")return `<section class="settings-card"><h2>DID 与授权</h2><p>陌生主体协作时，验证身份、能力、授权与回单；熟悉关系也不自动越过权限。</p>${[["当前组织","did:anp:haiyue-east"],["默认跨组织投影","单一 Matter / 最小字段 / 72 小时"],["业务承诺","业务负责人具名批准"],["生产数据扩大范围","数据责任人联签"],["撤销传播","同步到绑定 Agent 运行与未完成指派"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><button class="btn secondary" data-ind-toast="已打开${x[0]}记录">查看</button></div>`).join("")}</section>`;
        return `<section class="settings-card"><h2>运行上下文 / 授权 / Receipt</h2><p>面向技术与审计人员。Matter 是人可见的持久工作对象；每次 Agent 运行从中取得最小投影，写回 Receipt 后结束。本页只检查运行记录。</p>${[["最近运行","海岳机会响应 Agent / INV-HY-720"],["最小投影","品类、海岳候选数量、窗口、质检口径"],["禁止字段","买方预算、江岚报价、海岳成本与线体明细"],["允许写回","海岳签名响应 + Receipt"],["技术标识","AIC Inspector · aic:run:haiyue-call-720"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="pill gray">inspect</span></div>`).join("")}</section>`;
      }
      function renderFactorySettings(){const m=factorySettingInfo[state.settings]||factorySettingInfo.general;return `<div class="pane solution-layout"><aside class="solution-menu"><div class="side-title"><h2>设置</h2><p>借鉴 demo v2 的方案与配置 Matter</p></div><nav class="subnav-list">${[["general","基本与身份"],["solutions","已安装方案"],["collab","协作规则 / SIDE"],["partner","AWiki 伙伴"],["agents","Agent 与数据空间"],["identity","身份与授权"],["advanced","高级运行记录"]].map(x=>`<button class="subnav-btn ${state.settings===x[0]?'on':''}" data-ind-setting="${x[0]}"><span>${x[1]}</span><span>›</span></button>`).join("")}</nav></aside><main class="settings-main"><header class="settings-head"><span class="eyebrow">SETTINGS · HAIYUE FACTORY</span><h1>${m[0]}</h1><p>${m[1]}</p></header>${factorySettingsBody()}</main></div>`}

      let toastTimer=0;function toast(text){const el=document.querySelector("#toast");if(!el)return;clearTimeout(toastTimer);el.textContent=text;el.classList.add("on");toastTimer=setTimeout(()=>el.classList.remove("on"),2200)}
      function go(route){if(!routeSet.has(route))return;state.route=route;history.replaceState(null,"",`#/${route}`);render()}
      function openMatter(id){if(!matterDefs[id])return;if(!availableMatters().includes(id)){toast("该 Matter 尚未由上游人员决定派生");return}state.matterId=id;state.segment="matter";go("messages")}
      function rerenderToBottom(){render();requestAnimationFrame(()=>{const b=document.querySelector("#chat-body");if(b)b.scrollTop=b.scrollHeight})}
      function decide(choice){
        const scene=currentScene();if(!scene.collab||state.matterId!==scene.matter)return;
        if(choice==="decline"){state.collab[String(scene.id)]={phase:"declined",choice,draft:scene.collab.decline};rerenderToBottom();toast("暂停决定已由责任人写回 Matter；没有指派 Agent");return}
        state.collab[String(scene.id)]={phase:"written",choice:"accept",draft:scene.collab.draft};rerenderToBottom();toast("用户决定已写回 Matter；尚未指派或执行")
      }
      function adjustDecision(){const scene=currentScene();if(!scene.collab)return;state.collab[String(scene.id)]={phase:"editing",choice:"modify",draft:scene.collab.draft};render();requestAnimationFrame(()=>document.querySelector("#decision-draft")?.focus())}
      function writeEdited(){const scene=currentScene(),v=document.querySelector("#decision-draft")?.value.trim();if(!v){document.querySelector("#decision-draft")?.focus();return}state.collab[String(scene.id)]={phase:"written",choice:"modify",draft:v};rerenderToBottom();toast("调整后的决定已由责任人写回 Matter")}
      function assignAgent(){const scene=currentScene(),cs=collabState(scene.id);if(!scene.collab||cs?.phase!=="written"){toast("请先由责任人确认并写回决定");return}cs.phase="assigned";rerenderToBottom();toast(`已在 Matter 中指派 ${scene.collab.agent}；尚未执行`)}
      function executeAgent(){const scene=currentScene(),cs=collabState(scene.id);if(!scene.collab||cs?.phase!=="assigned"){toast("只有已接受的指派才能执行");return}cs.phase="executed";rerenderToBottom();toast(`${scene.collab.agent} 已执行并写回 Receipt`)}
      function advanceScene(){
        const scene=currentScene();if(scene.collab&&!isExecuted(scene.id)){toast("需要完成决定、写回、指派和执行回单后才能进入下一环节");return}
        if(scene.final){toast("本轮已完成，可从方案页重置演示");return}
        state.scene=Math.min(sceneDefs.length,state.scene+1);state.matterId=currentScene().matter;state.segment="matter";state.editingScene=null;render();requestAnimationFrame(()=>{const b=document.querySelector("#chat-body");if(b)b.scrollTop=0});toast(currentScene().matter===scene.matter?"同一 Matter 进入下一办理环节":"已按上游 Receipt 接续到新的 Matter")
      }
      function resetDemo(){state.scene=1;state.matterId="report";state.segment="matter";state.collab={};state.manual={};state.privateTurn={};state.sessionManual={};try{sessionStorage.removeItem("awiki-industry-flow-v3")}catch(_){}render();toast("已重置：从长期数据报送 Matter 开始")}

      document.addEventListener("click",e=>{
        const t=e.target.closest("button");if(!t)return;
        if(t.dataset.indRoute){go(t.dataset.indRoute);return}
        if(t.dataset.indSegment){state.segment=t.dataset.indSegment;render();return}
        if(t.dataset.indSession){state.sessionId=t.dataset.indSession;render();return}
        if(t.dataset.indMatter){state.matterId=t.dataset.indMatter;render();return}
        if(t.dataset.indMatterOpen){openMatter(t.dataset.indMatterOpen);return}
        if(t.dataset.indDecision){decide(t.dataset.indDecision);return}
        if(t.dataset.indAdjust){adjustDecision();return}
        if(t.dataset.indWriteEdit){writeEdited();return}
        if(t.dataset.indCancelEdit){delete state.collab[String(currentScene().id)];render();return}
        if(t.dataset.indReopen){const scene=currentScene(),cs=collabState(scene.id);if(cs?.phase==="declined")(state.manual[scene.matter]??=[]).push(`【暂停决定】${cs.draft}`);delete state.collab[String(scene.id)];render();toast("已重新打开私人建议；原暂停决定保留在 Matter 轨迹中");return}
        if(t.dataset.indAssign){assignAgent();return}
        if(t.dataset.indExecute){executeAgent();return}
        if(t.dataset.indNext){advanceScene();return}
        if(t.dataset.indCurrent){state.matterId=currentScene().matter;render();return}
        if(t.dataset.indPrivate){state.privateTurn[String(currentScene().id)]=t.dataset.indPrivate;render();return}
        if(t.dataset.indPartnerSend){const input=document.querySelector("#partner-input"),v=input?.value.trim();if(!v){input?.focus();return}state.privateTurn[String(currentScene().id)]={question:v,answer:`我会把“${v}”放在当前 Matter 的授权和证据边界内分析。先在右侧形成草稿；只有你点击确认发送，内容才会进入中间事项群。`};render();return}
        if(t.dataset.indOverview){state.overview=t.dataset.indOverview;state.feedIndex=0;render();return}
        if(t.dataset.indOverviewView){state.overviewView=t.dataset.indOverviewView;render();return}
        if(t.dataset.indOverviewScope){state.overviewScope=t.dataset.indOverviewScope;state.feedIndex=0;render();return}
        if(t.dataset.indFeedSelect!==undefined){const x=visibleFeedItems()[Number(t.dataset.indFeedSelect)];if(x)state.feedIndex=Number(t.dataset.indFeedSelect);render();return}
        if(t.dataset.indConnCat){state.connCat=t.dataset.indConnCat;state.connId=connections[state.connCat][0].id;render();return}
        if(t.dataset.indConn){state.connId=t.dataset.indConn;render();return}
        if(t.dataset.indAwikiCat){state.awikiCat=t.dataset.indAwikiCat;state.awikiIndex=0;render();return}
        if(t.dataset.indAwikiItem!==undefined){state.awikiIndex=Number(t.dataset.indAwikiItem)||0;render();return}
        if(t.dataset.indConnMembers){state.connCat="members";state.connId="supplier1";go("connections");return}
        if(t.dataset.indSetting){state.settings=t.dataset.indSetting;render();return}
        if(t.dataset.indSettings){state.settings=t.dataset.indSettings;go("settings");return}
        if(t.dataset.indAgent){state.connCat=connections.myAgents.some(x=>x.id===t.dataset.indAgent)?"myAgents":"contactAgents";state.connId=t.dataset.indAgent;go("connections");return}
        if(t.dataset.indStart){state.matterId=currentScene().matter;state.segment="matter";go("messages");return}
        if(t.dataset.indReset){resetDemo();return}
        if(t.dataset.indSend){const input=document.querySelector("#matter-input"),v=input?.value.trim();if(!v){input?.focus();return}(state.manual[state.matterId]??=[]).push(v);rerenderToBottom();toast(`已以${actorFor().name}身份写入当前 Matter 群`);return}
        if(t.dataset.indSessionSend){const input=document.querySelector("#session-input"),v=input?.value.trim();if(!v){input?.focus();return}(state.sessionManual[state.sessionId]??=[]).push(v);rerenderToBottom();toast("已发送到当前会话；未改变任何 Matter");return}
        if(t.dataset.indNote){const v=document.querySelector("#quick-note")?.value.trim();toast(v?"已收进 Inbox；尚未改变任何 Matter":"请先输入一条记录");return}
        if(t.dataset.indFeed){const id=t.dataset.indFeed;if(matterDefs[id])openMatter(id);else if(id==="community"){go("awiki")}else{for(const [cat,arr] of Object.entries(connections)){if(arr.some(x=>x.id===id)){state.connCat=cat;state.connId=id;go("connections");return}}toast("未找到对应来源")}return}
        if(t.dataset.indToast){toast(t.dataset.indToast);return}
      });
      document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="matter-input"){document.querySelector("[data-ind-send]")?.click()}if(e.key==="Enter"&&e.target.id==="session-input"){document.querySelector("[data-ind-session-send]")?.click()}if(e.key==="Enter"&&e.target.id==="partner-input"){document.querySelector("[data-ind-partner-send]")?.click()}if(e.key==="Enter"&&e.target.id==="quick-note"){document.querySelector("[data-ind-note]")?.click()}});
      window.addEventListener("hashchange",()=>{state.route=initialRoute();render()});
      render();
    })();
  </script>
</body>
</html>
