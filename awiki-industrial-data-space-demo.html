        {id:3,matter:"match",number:"03 / 09",title:"核验需求方资质后决定是否接单",time:"09:18",authority:"刘涛 · 海岳供应商经理",finding:"AWiki 伙伴已在当前事项的用途和最小字段范围内调用 DocPilot 企业合规风控服务。北辰主体信息一致，未命中失信或被执行风险；但存在 2 项历史合同纠纷，且未随喊单提供最新审计材料。结合海岳 720 吨可承诺能力，建议“有条件响应”，而不是自动接单。",suggestion:"先在右侧预览核验结果；如接受建议，再把“720 吨条件响应 + 补充审计材料 + 分批交付与付款条件”写入喊单事项，并由机会响应 Agent 发送签名响应。",reasons:["DocPilot 是被 AWiki 伙伴调用的专业 AI 应用，不需要伪装成协作 Agent","服务只接收需求主体、公开查询条件与本事项用途，不读取海岳成本或他方报价","风险结论是接单建议的依据，业务承诺仍必须由刘涛具名确认"],evidence:["CAP-720-V2","INV-HY-720","RISK-BC-0918","MNT-L2-17"],base:()=>message("配","agent","供需匹配 Agent 已把海岳邀请状态更新为“已送达，等待工厂人员确认”；AWiki 伙伴已按授权调用专业风控服务，结果仅回写为当前事项的风险摘要与证据索引。",riskPreviewCard(),"09:18"),collab:{draft:"海岳对本次喊单作有条件响应：可承接 720 吨，首批窗口 10 月 18–22 日；需求方须在正式报价前补充最新审计材料，首单采用分批交付并按约定付款条件执行。最终批次与排产仍需内部生产计划事项批准。仅投影本厂数量、窗口和质检适配证明，不公开成本与线体明细。",decline:"海岳本轮暂不响应该喊单；保留邀请与风险核验回单，不向喊单群作供货承诺。",agent:"海岳机会响应 Agent",mark:"机",task:"向喊单群发送附带风险条件的海岳签名响应",assignment:"使用刘涛已确认的响应边界生成签名消息，并附 RISK-BC-0918 索引；不得追加产线、成本或未批准的排产承诺。",receiptTitle:"海岳喊单响应回单",receiptSource:"海岳机会响应 Agent / RSP-HY-720",receiptItems:[["响应","有条件承接 720t"],["条件","补审计材料 / 分批交付"],["边界","排产待内部批准"]],receiptText:"海岳签名响应已进入喊单群，包含可追溯的风控条件索引。供需匹配 Agent 将海岳列为已响应工厂，并等待江岚响应与质量证明。",next:"查看另一工厂响应与新阻塞"}},
        {id:4,matter:"match",number:"04 / 09",title:"协同处理江岚响应的质量阻塞",time:"09:36",authority:"周启明 · 场景协调人",finding:"江岚机会响应 Agent 也在喊单群接下 480 吨，但其批次证明缺少有效期，且耐热字段未映射到北辰标准。海岳响应仍然有效，无需重做。",suggestion:"在右侧确认一次限时补证范围，再把补证决定发进喊单群，指派公共合规 Agent 与江岚 Agent 完成核验。",reasons:["阻塞只影响江岚 480 吨响应","补证用途可限定为当前喊单事项","海岳与江岚的价格和内部数据继续隔离"],evidence:["RSP-JL-480","QA-SCHEMA-06","授权差异 2 字段"],base:()=>message("江","agent","江岚机会响应 Agent 已提交 480 吨条件响应；质检对齐服务将其状态标为“待补证”。",eventCard("江岚响应阻塞","缺失：批次证明有效期、耐热等级映射；海岳 720 吨响应保持有效。","BLOCK-QA-021"),"09:36"),collab:{draft:"向江岚发起 24 小时限时补证：仅补充批次证明有效期与耐热等级映射，用途限定为本次 PA66-GF30 喊单；不请求成本、完整库存或生产明细。",decline:"暂不发起补证；江岚响应保持阻塞，请需求方判断是否接受单一供给或等待替代工厂。",agent:"数据空间合规校验 Agent",mark:"规",task:"协同江岚 Agent 完成限时补证",assignment:"按当前事项的 2 个缺失字段和 24 小时范围核验签名、有效期与用途，不得扩展授权。",receiptTitle:"江岚限时补证回单",receiptSource:"江岚 Agent + 公共合规 Agent",receiptItems:[["有效期","2026-10-31"],["耐热","等级 H 已映射"],["授权","本事项/ 24h"]],receiptText:"江岚补证通过，480 吨响应转为可匹配；海岳与江岚的两份签名响应都已具备组合计算条件。",next:"查看匹配 Agent 汇总结果"}},
        {id:5,matter:"match",number:"05 / 09",title:"汇总工厂响应并派生合作执行",time:"09:52",authority:"周启明 · 场景协调人",finding:"需求 Agent 的签名需求、海岳与江岚的工厂响应、质量补证和最小授权已经齐备。匹配 Agent 可把“候选响应”汇总为多方待确认的双源结果。",suggestion:"从右侧确认最终组合并发送到喊单群，再指派合作编排 Agent 派生执行事项；只继承已验证事实和回单索引。",reasons:["两家工厂都由各自人员批准响应","质量阻塞已解除","报价附件继续点对点隔离"],evidence:["DSP-REQ-087","RSP-HY-720","RSP-JL-480","BLOCK-QA-021 已解除"],base:()=>message("配","agent","数据空间供需匹配 Agent 已汇总两家工厂签名响应：数量、批次窗口、质检口径和授权范围全部通过，等待场景协调人冻结结果。",receipt("最终匹配草案","公共匹配 Agent",[["方案","海岳 720t + 江岚 480t"],["窗口","两批交付"],["状态","待多方确认"]]),"09:52"),collab:{draft:"冻结双源匹配结果：海岳 720 吨、江岚 480 吨，两批交付；继承需求证明、两家工厂签名响应、质检映射和最小授权索引，价格附件继续点对点隔离。",decline:"暂不冻结匹配结果；保留全部响应和补证回单，等待需求方重新确认交付窗口。",agent:"合作编排 Agent",mark:"编",task:"依据已冻结结果创建跨组织合作执行事项",assignment:"创建合作执行事项，仅继承已验证事实和授权索引；按 DID 邀请需求方、两家供给方及其 Agent。",receiptTitle:"合作事项派生回单",receiptSource:"AWiki 协作编排服务",receiptItems:[["父事项","需求喊单"],["参与方","3 组织 / 5 Agent"],["隔离","报价点对点"]],receiptText:"合作执行事项已创建；匹配结果成为接续依据，各方 Agent 只获得自身任务所需投影。",next:"进入合作执行事项"}},
        {id:6,matter:"cooperation",number:"06 / 09",title:"确认合作框架并派生企业内部执行",time:"10:18",authority:"王璐 · 采购负责人",finding:"多方 Agent 已对齐供货、交付和质检框架。价格附件保持点对点，结算只读取签收摘要；DocPilot 合同审核服务提示，在生成正式合同前仍需核验签约主体、资质、授权签字和权责条款。",suggestion:"确认数量、交付窗口、质检和回单条件；同时把合同审核列为正式签约前的独立关口，再指派合作 Agent 派生海岳、江岚和东港各自的内部执行事项。",reasons:["跨组织共同事实已经最小化","合同审核服务只读取合同草案与必要主体材料，不读取排产明细","父子事项可让后续回单继续可追溯"],evidence:["框架草案 FW-017","DID 参与方清单","结算触发规则","DocPilot 合同规则集 CT-19"],transition:{from:"PA66-GF30 1200 吨需求喊单",text:"已冻结匹配结果接续为合作执行依据；候选讨论和无关上下文没有被投影。"},base:()=>message("系","org","系统依据已冻结匹配结果创建跨组织合作群；北辰、海岳、江岚、东港及各自 Agent 已按 DID 与任务范围加入。",eventCard("上下文接续完成","继承需求证明、供给承诺、质检映射、授权范围与回单索引；各方报价仍隔离。","MATTER-COOP-1008"),"10:06")+message("优","agent","供应链优化 Agent 已形成双源协同草案，东港可统一编排交付；结算按签收回单触发。",receipt("合作框架草案","供应链优化 Agent",[["供货","720t + 480t"],["交付","两批 / 统一质检"],["结算","签收回单触发"]]),"10:18")+message("D","agent","AWiki 伙伴已将合同草案的主体、资质、签字与权责字段送入 DocPilot 预审；发现的问题将以建议和证据索引回到当前事项，正式签约仍需人工复核。",eventCard("合同审核关口已建立","核验：主体资格、公司信息一致性、授权签字、权责与违约条款；合同正文在原应用中查看与修改。","CONTRACT-GATE-01"),"10:19"),collab:{draft:"确认合作框架：双源数量与两批窗口进入共同事实；质检按统一字段回单；结算由签收摘要触发。价格附件保持点对点隔离；正式合同须先经 DocPilot 审核并由法务确认，再分别派生三方内部执行事项。",decline:"暂不确认合作框架；保留已冻结匹配结果，请法务与采购补充结算触发条件。",agent:"合作执行 Agent",mark:"合",task:"写入共同框架并生成组织内执行事项",assignment:"按确认框架生成海岳、江岚、东港内部执行事项；每个子事项只继承该组织所需上下文。",receiptTitle:"内部事项派生回单",receiptSource:"AWiki 协作编排服务",receiptItems:[["海岳","720t 生产计划"],["江岚","480t 备货"],["东港","两批运力"]],receiptText:"三方内部执行事项已生成；合同审核关口与风险证据索引已一并保留。本演示进入海岳 720 吨生产计划；其他组织只回送承诺与状态证明。",next:"进入海岳内部生产事项"}},
        {id:7,matter:"production",number:"07 / 09",title:"解决维护冲突并批准 MES 写回",time:"10:36",authority:"陈工 · 生产计划经理",finding:"智能排产 Agent 的首版计划碰到 L2 维护窗口；需求预测 Agent 又提示 10 月下旬可能上浮 8%。Agent 已生成修订案，但没有权限直接写入 MES。",suggestion:"采用 L2 提前 420 吨、L3 完成 300 吨并保留 24 小时缓冲的方案；你写回决定后，再指派企业排产 Agent 写入 MES 草稿区。",reasons:["修订案不越过维护窗口","首批 420 吨可提前锁定运力","对外只需回送承诺证明和批次窗口"],evidence:["PLAN-031","MNT-L2-17","FC-009"],transition:{from:"北辰 × 海岳 / 江岚 合作执行",text:"本事项只继承海岳 720 吨、交付窗口和质检要求；江岚报价与北辰预算不进入海岳内部。"},base:()=>message("排","agent","智能排产 Agent 读取已确认订单、MES 线体能力与维护窗口，发现首版计划和 L2 10/17 维护冲突。",receipt("修订排产草案","海岳企业 Agent",[["L2","420t · 10/10–16"],["L3","300t · 10/12–18"],["缓冲","L3 保留 24h"]]),"10:28")+message("预","agent","公共需求预测 Agent 仅使用区域聚合数据，返回 10 月下旬 +8% / -3% 的波动区间；未读取海岳成本或线体明细。","","10:32"),collab:{draft:"批准修订排产：L2 于维护前完成 420 吨，L3 完成 300 吨并保留 24 小时缓冲；锁定首批运力。对外仅回送 720 吨可交付证明、批次窗口和回单哈希。",decline:"暂不写入 MES；请排产 Agent保留草案，并由设备经理重新确认 L2 维护窗口。",agent:"智能排产 Agent",mark:"排",task:"把已批准计划写入 MES 草稿区并回送承诺证明",assignment:"按批准的两线方案写入 MES 草稿区，等待陈工系统签收；对外仅发布承诺产能证明。",receiptTitle:"MES 写回与承诺回单",receiptSource:"海岳内部 / PLAN-2026-1010",receiptItems:[["MES","草稿已写入"],["签收","陈工已确认"],["对外","CAP-720-V3"]],receiptText:"生产计划已写入 MES 并签收；可信数据空间收到更新后的承诺产能证明，履约事项已按批次生成。",next:"进入履约与结算事项"}},

        return `<div class="pane solution-layout"><aside class="solution-menu"><div class="side-title"><h2>方案</h2><p>面向中化数智研讨的场景层原型</p></div><nav class="subnav-list"><button class="subnav-btn on"><span>产业链协同贸易</span><span>AWiki 伙伴</span></button><button class="subnav-btn" data-ind-toast="本版本聚焦一个完整场景，不扩散到其他方案"><span>连锁运营</span><span>—</span></button></nav><div class="notice"><span>!</span><span>全部组织、人物、订单与效果数据均为虚构研讨数据，不代表中化数智生产系统或真实成效。</span></div></aside><main class="solution-main"><section class="hero"><div><span class="eyebrow">ANP × AWIKI × AWiki 伙伴· TRUSTED DATA SPACE SCENE LAYER</span><h1>让可信数据空间从“数据可用”进入“人员可协同、事项可执行、结果可验收”</h1><p>化工厂持续报送可信数据产品；采购方发起需求喊单；多方 Agent 在事项群完成供需匹配；人员批准后派生合作执行与企业内部排产事项。数据空间是底座，AWiki 是面向人员和 Agent 的场景协同层。</p></div><div class="hero-actions"><button class="btn secondary" data-ind-reset="true">重置演示</button><button class="btn primary" data-ind-start="true">${p===1?'从数据报送事项开始':'继续当前事项'}</button></div></section><div class="proof-chain"><article><span>01 · DATA PRODUCT</span><b>产能 / 库存 / 需求证明</b></article><article><span>02 · AWiki 伙伴</span><b>角色化数据服务</b></article><article><span>03 · MATTER</span><b>多人多 Agent 协调</b></article><article><span>04 · HUMAN CHECK</span><b>具名人员决定</b></article><article><span>05 · AIC / ANP</span><b>最小投影与跨域协作</b></article><article><span>06 · RECEIPT</span><b>执行回单与 Impact</b></article></div>
        <section class="section"><div class="section-head"><div><h2>三位一体：方案 SOP × 连接关系 × 协同漏斗</h2><p>三个视图指向同一组事项、连接、授权和回单，不形成三套业务事实。</p></div><span class="pill">当前演示 ${p} / ${sceneDefs.length} · ${progressPercent()}%</span></div><div class="triad"><article><strong>01</strong><b>SOP + AI 助力</b><p>AI 私人分析 → 用户决定并写回 → 用户指派 → Agent 执行 → Receipt；每一步都可见且不可跳过。</p></article><article><strong>02</strong><b>客户 / 会员落到工作人员</b><p>需求方、供给方、物流方和 Agent 都是可验证连接，并绑定具名客户经理、供应商经理和业务责任人。</p></article><article><strong>03</strong><b>AARRR 产业协同漏斗</b><p>需求进入、可信匹配、合作执行、稳定履约、网络复用分别有来源事项和责任回单。</p></article></div></section>
        <section class="section scene-grid"><article class="board"><div class="section-head"><div><h2>连续事项网络</h2><p>后续事项由已批准结果派生，跨组织与组织内上下文严格隔离。</p></div></div><div class="matter-network"><div class="network-row"><span class="kind">长期数据报送</span><span><b>华东三厂产能与库存报送</b><small>ERP / MES / DCS → 企业 Agent → 数据产品</small></span><span class="actors">工厂人员 + 企业 Agent</span></div><div class="network-row"><span class="kind">需求喊单事项</span><span><b>PA66-GF30 1200 吨供需匹配</b><small>需求方 + 多供给方 + 公共 / 对方 Agent</small></span><span class="actors">跨组织</span></div><div class="network-row"><span class="kind">合作执行事项</span><span><b>双源框架、交付、质检与结算</b><small>由人员批准的匹配结果自动派生</small></span><span class="actors">跨组织</span></div><div class="network-row"><span class="kind">内部生产事项</span><span><b>海岳 720 吨两线排产</b><small>只继承本企业所需上下文，计划经人员批准写入 MES</small></span><span class="actors">组织内</span></div><div class="network-row"><span class="kind">履约子事项</span><span><b>物流、质检、签收与结算回单</b><small>外部只见证明与状态，不见原始生产明细</small></span><span class="actors">跨组织</span></div></div></article><article class="board"><h3>AARRR 产业协同漏斗 · 演示口径</h3><div class="funnel">${[["Acquisition","需求报送",18,100],["Activation","可信匹配",12,75],["Revenue","合作执行",6,52],["Retention","稳定履约",5,38],["Referral","网络复用",3,25]].map(x=>`<div class="funnel-row"><span>${x[0]}<br><b>${x[1]}</b></span><div class="funnel-track"><i class="funnel-fill" style="width:${x[3]}%"></i><b>来源可追溯</b></div><strong>${x[2]}</strong></div>`).join("")}</div><div class="notice" style="margin-top:10px"><span>↗</span><span>漏斗数字是研讨演示；真实试点应分别核对“业务结果”和“SOP 执行覆盖”，不能把 Agent 任务完成当成成交。</span></div></article></section>
        <section class="section"><div class="section-head"><div><h2>在“21N3”可信数据空间之上的场景层</h2><p>充分使用底座能力，但不重复建设底座。</p></div></div><div class="architecture"><div class="arch-layer highlight"><span>AWIKI 场景层</span><div><b>人员目标、连接关系、事项群、AI 建议、Human Checkpoint、AIC、Receipt 与 Impact</b><small>把“数据产品能做什么”翻译为“谁在什么事项中如何授权、决定、执行和验收”。</small></div></div><div class="arch-layer"><span>N 个应用场景 / 数据产品</span><div><b>需求预测、智能排产、库存预警、物流调度、供应链优化 Agent</b><small>公司购买的、公共的、供需方自带的 Agent 都可通过 ANP 在同一事项受控协作。</small></div></div><div class="arch-layer"><span>1 个技术平台</span><div><b>可信数据空间：登记、合规、确权、可信计算、供需链商、交易与交付</b><small>原始 ERP / MES / DCS 与商业敏感数据在“可用不可见”前提下跨域协同。</small></div></div><div class="arch-layer"><span>2 类数据资源</span><div><b>集团内部数据湖 + 外部企业 / 高校 / 公共数据</b><small>通过连接器接入；场景层只获得当前事项所需的最小投影。</small></div></div><div class="support-row"><span>制度标准体系</span><span>运营体系</span><span>生态体系</span></div></div></section>

        if(state.settings==="solutions")return `<section class="settings-card"><h2>当前工作域已安装服务包</h2><p>服务包为海岳增加工作对象、专业伙伴经验、业务连接和专用界面。</p><div class="agent-bindings"><div class="agent-binding"><i>贸</i><span><b>产业链协同贸易</b><span>喊单、合作、排产与履约 · v2.1</span></span><span class="pill ok">运行中</span></div><div class="agent-binding"><i>风</i><span><b>企业尽调与接单风控</b><span>DocPilot 尽调与合同审核 · v1.0</span></span><span class="pill ok">已安装</span></div><div class="agent-binding"><i>报</i><span><b>数据产品持续报送</b><span>ERP / MES / DCS → 可信证明 · v2.0</span></span><span class="pill ok">运行中</span></div><div class="agent-binding"><i>排</i><span><b>生产排程与履约</b><span>内部排产、物流、质检和回单 · v1.3</span></span><span class="pill gray">待启用</span></div></div></section>`;
        if(state.settings==="collab")return `<section class="settings-card"><h2>产业链协同贸易 · 协作规则</h2><p>服务包围绕事项持续组织资源、判断、行动与结果评估。</p><div class="side-grid"><article><strong>资</strong><b>资源与权限</b><p>数据产品、连接、证据和使用边界。</p></article><article><strong>判</strong><b>分析与建议</b><p>差异、风险、备选与依据。</p></article><article><strong>行</strong><b>决定与执行</b><p>人员决定、Agent指派和系统写回。</p></article><article><strong>验</strong><b>状态与验收</b><p>阻塞、Receipt和业务结果。</p></article></div></section>${configMatter("collab")}`;
        if(state.settings==="partner")return `<section class="settings-card"><h2>伙伴默认行为 · AWiki Me</h2><p>基础伙伴可协助理解、整理、提醒和起草；不会自动对外发送或形成业务承诺。</p>${[["基础可读范围","当前页面 + 用户允许的个人上下文"],["基础可起草","回复、摘要、提醒与工作草稿"],["不可代办","不可替用户发送、承诺或扩大授权"],["服务包增强","产业链协同贸易增加接单、风控、排产与履约经验"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="pill ${x[0]==='不可代办'?'warn':'ok'}">${x[0]==='服务包增强'?'已安装':'已治理'}</span></div>`).join("")}</section>${configMatter("partner")}`;
        if(state.settings==="agents")return `<section class="settings-card"><h2>Agent、AI 应用与专业服务</h2><p>人员选择业务能力和授权，不直接面对底层 API / 连接器；合作伙伴可先以 API、服务账号或受控预览接入，不必先改造成 Agent。</p><div class="agent-bindings"><div class="agent-binding"><i>报</i><span><b>海岳数据报送 Agent</b><span>ERP / MES / DCS → 工厂域证明 → 数据空间数据产品目录</span></span><span class="pill ok">在线</span></div><div class="agent-binding"><i>机</i><span><b>海岳机会响应 Agent</b><span>数据空间匹配邀请 → 工厂人员 → 签名响应</span></span><span class="pill ok">已连接</span></div><div class="agent-binding"><i>配</i><span><b>公共供需匹配 Agent</b><span>可信需求产品 + 供给能力产品 → 候选邀请 Receipt</span></span><span class="pill">公共服务</span></div><div class="agent-binding"><i>D</i><span><b>DocPilot 企业合规风控服务</b><span>需求主体与必要材料 → 风险摘要 / 证据索引 → AWiki 伙伴卡片预览 → 原应用复核</span></span><span class="pill warn">本轮已调用</span></div><div class="agent-binding"><i>排</i><span><b>海岳智能排产 Agent</b><span>已确认合作结果 → 内部计划 → MES 草稿区</span></span><span class="pill gray">待派生</span></div></div></section><section class="settings-card"><h2>为什么不直接连数据空间</h2><p>AWiki 伙伴将底层数据产品、身份、用途和回单转成岗位可用的“接单、报送、排产、风控复核”能力；每次调用仍由事项授权和记录。</p></section>`;
        if(state.settings==="identity")return `<section class="settings-card"><h2>数据与安全</h2><p>AWiki Me 提供通用身份、设备、数据与审计设置；服务包只追加自己的授权模板。</p>${[["当前组织","did:anp:haiyue-east"],["数据导出与保留","按个人、组织与工作域管理"],["设备与登录","当前设备已验证，可随时撤销"],["化工包授权模板","单一事项 / 最小字段 / 72 小时"],["业务承诺","业务负责人具名批准"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><button class="btn secondary" data-ind-toast="已打开${x[0]}记录">查看</button></div>`).join("")}</section>`;
        return `<section class="settings-card"><h2>运行上下文 / 授权 / Receipt</h2><p>面向技术与审计人员。事项是人可见的持久工作对象；每次 Agent 运行从中取得最小投影，写回 Receipt 后结束。本页只检查运行记录。</p>${[["最近运行","海岳机会响应 Agent / INV-HY-720"],["最小投影","品类、海岳候选数量、窗口、质检口径"],["禁止字段","买方预算、江岚报价、海岳成本与线体明细"],["允许写回","海岳签名响应 + Receipt"],["技术标识","AIC Inspector · aic:run:haiyue-call-720"]].map(x=>`<div class="setting-row"><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="pill gray">inspect</span></div>`).join("")}</section>`;
      }
      function renderFactorySettings(){const m=factorySettingInfo[state.settings]||factorySettingInfo.general;return `<div class="pane solution-layout"><aside class="solution-menu"><div class="side-title"><h2>设置</h2><p>借鉴 demo v2 的方案与配置事项</p></div><nav class="subnav-list">${[["general","基本与身份"],["solutions","已安装方案"],["collab","协作规则 / SIDE"],["partner","AWiki 伙伴"],["agents","Agent、AI 应用与服务"],["identity","身份与授权"],["advanced","高级运行记录"]].map(x=>`<button class="subnav-btn ${state.settings===x[0]?'on':''}" data-ind-setting="${x[0]}"><span>${x[1]}</span><span>›</span></button>`).join("")}</nav></aside><main class="settings-main"><header class="settings-head"><span class="eyebrow">SETTINGS · HAIYUE FACTORY</span><h1>${m[0]}</h1><p>${m[1]}</p></header>${factorySettingsBody()}</main></div>`}

      function renderFactorySettings(){
        const m=factorySettingInfo[state.settings]||factorySettingInfo.general;
        const nav=(items)=>items.map(x=>`<button class="subnav-btn ${state.settings===x[0]?'on':''}" data-ind-setting="${x[0]}"><span>${x[1]}</span><span>›</span></button>`).join("");
        return `<div class="pane solution-layout compact-setting"><aside class="solution-menu"><div class="side-title"><h2>设置</h2><p>基础能力与服务包扩展分开管理</p></div><div class="settings-group-label">AWiki Me 基础设置</div><nav class="subnav-list">${nav([["general","身份与工作域"],["communication","消息与通知"],["inbox","Inbox 与一览"],["connections","连接与授权"],["partner","AWiki 伙伴"],["identity","数据与安全"]])}</nav><div class="settings-group-label package">已安装服务包</div><nav class="subnav-list">${nav([["solutions","服务包与工作"],["collab","方案协作规则"],["agents","Agent 与服务"],["advanced","运行记录"]])}</nav><div class="notice"><span>i</span><span>上半部分开箱即有；下半部分由“产业链协同贸易”等已安装服务包注入。</span></div></aside><main class="settings-main"><header class="settings-head"><span class="eyebrow">${["solutions","collab","agents","advanced"].includes(state.settings)?'INSTALLED SERVICE PACKAGE':'AWIKI ME BASE'}</span><h1>${m[0]}</h1><p>${m[1]}</p></header>${factorySettingsBody()}</main></div>`;
      }

      let toastTimer=0;function toast(text){const el=document.querySelector("#toast");if(!el)return;clearTimeout(toastTimer);el.textContent=text;el.classList.add("on");toastTimer=setTimeout(()=>el.classList.remove("on"),2200)}
      function go(route){if(!routeSet.has(route))return;state.route=route;history.replaceState(null,"",`#/${route}`);render()}
      function openMatter(id){if(!matterDefs[id])return;if(!availableMatters().includes(id)){toast("该事项尚未由上游人员决定派生");return}state.matterId=id;state.workMatterId=id;state.workSection="matters";go("solutions")}
      function scrollChatSurfacesToBottom(){
        document.querySelectorAll(".chat-body, .companion-body").forEach(el=>{el.scrollTop=el.scrollHeight});
      }
      function rerenderToBottom(){render()}
      function decide(choice){
        const scene=currentScene();if(!scene.collab||state.matterId!==scene.matter)return;
        if(choice==="decline"){state.collab[String(scene.id)]={phase:"declined",choice,draft:scene.collab.decline};rerenderToBottom();toast("暂停决定已由责任人写回事项；没有指派 Agent");return}
        state.collab[String(scene.id)]={phase:"written",choice:"accept",draft:scene.collab.draft};rerenderToBottom();toast("用户决定已写回事项；尚未指派或执行")
      }
      function adjustDecision(){const scene=currentScene();if(!scene.collab)return;state.collab[String(scene.id)]={phase:"editing",choice:"modify",draft:scene.collab.draft};render();requestAnimationFrame(()=>document.querySelector("#decision-draft")?.focus())}
      function writeEdited(){const scene=currentScene(),v=document.querySelector("#decision-draft")?.value.trim();if(!v){document.querySelector("#decision-draft")?.focus();return}state.collab[String(scene.id)]={phase:"written",choice:"modify",draft:v};rerenderToBottom();toast("调整后的决定已由责任人写回事项")}
      function assignAgent(){const scene=currentScene(),cs=collabState(scene.id);if(!scene.collab||cs?.phase!=="written"){toast("请先由责任人确认并写回决定");return}cs.phase="assigned";rerenderToBottom();toast(`已在事项中指派 ${scene.collab.agent}；尚未执行`)}
      function executeAgent(){const scene=currentScene(),cs=collabState(scene.id);if(!scene.collab||cs?.phase!=="assigned"){toast("只有已接受的指派才能执行");return}cs.phase="executed";rerenderToBottom();toast(`${scene.collab.agent} 已执行并写回 Receipt`)}
      function advanceScene(){
        const scene=currentScene();if(scene.collab&&!isExecuted(scene.id)){toast("需要完成决定、写回、指派和执行回单后才能进入下一环节");return}
        if(scene.final){toast("本轮已完成，可从工作中重置演示");return}
        state.scene=Math.min(sceneDefs.length,state.scene+1);state.matterId=currentScene().matter;state.workMatterId=currentScene().matter;state.segment="matter";state.editingScene=null;if(currentScene().id===3)state.panel="riskReport";render();toast(currentScene().matter===scene.matter?"同一事项进入下一办理环节":"已按上游 Receipt 接续到新的事项")
      }
      function resetDemo(){state.scene=1;state.matterId="report";state.workMatterId="report";state.segment="session";state.workSection="matters";state.panel=null;state.collab={};state.manual={};state.privateTurn={};state.sessionManual={};try{sessionStorage.removeItem("awiki-industry-flow-v3")}catch(_){}render();toast("已重置：从海岳长期数据报送事项开始")}

      document.addEventListener("click",e=>{
        if(e.target.classList.contains("context-panel-backdrop")||e.target.closest("[data-ind-panel-close]")){state.panel=null;render();return}
        const t=e.target.closest("button");if(!t)return;
        if(t.dataset.indPanel){state.panel=t.dataset.indPanel;render();return}
        if(t.dataset.indRelatedMatter){const id=t.dataset.indRelatedMatter;state.panel=null;state.workSection="matters";state.workMatterId=id;state.matterId=id;go("solutions");return}
        if(t.dataset.indRoute){if(t.dataset.indRoute==="solutions")state.workSection="matters";go(t.dataset.indRoute);return}
        if(t.dataset.indSegment){state.segment=t.dataset.indSegment;render();return}
        if(t.dataset.indSession){state.sessionId=t.dataset.indSession;render();return}
        if(t.dataset.indSessionConnection){const target=sessionConnections[state.sessionId];if(target){state.connCat=target[0];state.connId=target[1];go("connections")}return}
        if(t.dataset.indContact){const map={wang:"buyer",zhao:"factory",factorygroup:"quality",liu:"manager"},id=map[t.dataset.indContact];if(id){state.sessionId=id;state.panel=null;go("messages")}else toast("该对象尚无直接会话；已生成联系草稿");return}
        if(t.dataset.indMatter){state.matterId=t.dataset.indMatter;render();return}
        if(t.dataset.indMatterOpen){openMatter(t.dataset.indMatterOpen);return}
        if(t.dataset.indDecision){decide(t.dataset.indDecision);return}
        if(t.dataset.indAdjust){adjustDecision();return}
        if(t.dataset.indWriteEdit){writeEdited();return}
        if(t.dataset.indCancelEdit){delete state.collab[String(currentScene().id)];render();return}
        if(t.dataset.indReopen){const scene=currentScene(),cs=collabState(scene.id);if(cs?.phase==="declined")(state.manual[scene.matter]??=[]).push(`【暂停决定】${cs.draft}`);delete state.collab[String(scene.id)];render();toast("已重新打开私人建议；原暂停决定保留在事项轨迹中");return}
        if(t.dataset.indAssign){assignAgent();return}
        if(t.dataset.indExecute){executeAgent();return}
        if(t.dataset.indNext){advanceScene();return}
        if(t.dataset.indCurrent){state.matterId=currentScene().matter;state.workMatterId=currentScene().matter;render();return}
        if(t.dataset.indPrivate){state.privateTurn[String(currentScene().id)]=t.dataset.indPrivate;render();return}
        if(t.dataset.indPartnerSend){const input=document.querySelector("#partner-input"),v=input?.value.trim();if(!v){input?.focus();return}state.privateTurn[String(currentScene().id)]={question:v,answer:`我会把“${v}”放在当前事项的授权和证据边界内分析。先在右侧形成草稿；只有你点击确认发送，内容才会进入中间事项群。`};render();return}
        if(t.dataset.indOverview){state.overview=t.dataset.indOverview;state.feedIndex=0;render();return}
        if(t.dataset.indOverviewView){state.overviewView=t.dataset.indOverviewView;render();return}
        if(t.dataset.indOverviewScope){state.overviewScope=t.dataset.indOverviewScope;state.feedIndex=0;render();return}
        if(t.dataset.indFeedSelect!==undefined){const x=visibleFeedItems()[Number(t.dataset.indFeedSelect)];if(x)state.feedIndex=Number(t.dataset.indFeedSelect);render();return}
        if(t.dataset.indConnCat){state.connCat=t.dataset.indConnCat;state.connId=connections[state.connCat][0].id;render();return}
        if(t.dataset.indConn){state.connId=t.dataset.indConn;render();return}
        if(t.dataset.indOpenService){state.connCat="serviceAccounts";state.connId=t.dataset.indOpenService;go("connections");return}
        if(t.dataset.indAwikiCat){state.awikiCat=t.dataset.indAwikiCat;state.awikiIndex=0;render();return}
        if(t.dataset.indAwikiItem!==undefined){state.awikiIndex=Number(t.dataset.indAwikiItem)||0;render();return}
        if(t.dataset.indCommunity){const item=awikiCatalog.communities[state.awikiIndex]||awikiCatalog.communities[0];state.joinedCommunities[item.title]=true;state.panel="community";render();toast(`已加入「${item.title}」；未安装任何方案或插件`);return}
        if(t.dataset.indConnMembers){state.connCat="members";state.connId="supplier1";go("connections");return}
        if(t.dataset.indSetting){state.settings=t.dataset.indSetting;render();return}
        if(t.dataset.indWorkSection){state.workSection=t.dataset.indWorkSection;state.workItem=0;render();return}
        if(t.dataset.indWorkMatter){state.workMatterId=t.dataset.indWorkMatter;state.matterId=t.dataset.indWorkMatter;render();return}
        if(t.dataset.indWorkItem!==undefined){state.workItem=Number(t.dataset.indWorkItem)||0;render();return}
        if(t.dataset.indPackageOverview){state.workSection="packageOverview";render();return}
        if(t.dataset.indSettings){state.settings=t.dataset.indSettings;state.panel=null;go("settings");return}
        if(t.dataset.indAgent){state.connCat=connections.myAgents.some(x=>x.id===t.dataset.indAgent)?"myAgents":"contactAgents";state.connId=t.dataset.indAgent;go("connections");return}
        if(t.dataset.indStart){state.matterId=currentScene().matter;state.workMatterId=currentScene().matter;state.workSection="matters";go("solutions");return}
        if(t.dataset.indReset){resetDemo();return}
        if(t.dataset.indSend){const input=document.querySelector("#matter-input"),v=input?.value.trim();if(!v){input?.focus();return}(state.manual[state.matterId]??=[]).push(v);rerenderToBottom();toast(`已以${actorFor().name}身份写入当前事项群`);return}
        if(t.dataset.indSessionSend){const input=document.querySelector("#session-input"),v=input?.value.trim();if(!v){input?.focus();return}(state.sessionManual[state.sessionId]??=[]).push(v);rerenderToBottom();toast("已发送到当前会话；未改变任何事项");return}
        if(t.dataset.indNote){const input=document.querySelector("#quick-note"),v=input?.value.trim();if(!v){input?.focus();toast("请先输入一条记录");return}state.inboxNotes.unshift(v);state.feedIndex=0;render();toast("已收进 Inbox；尚未改变任何事项");return}
        if(t.dataset.indFeed){const id=t.dataset.indFeed;if(String(id).startsWith("inboxNote:")){state.panel="inboxClassify";render()}else if(matterDefs[id])openMatter(id);else if(id==="community"){go("awiki")}else{for(const [cat,arr] of Object.entries(connections)){if(arr.some(x=>x.id===id)){state.connCat=cat;state.connId=id;go("connections");return}}toast("未找到对应来源")}return}
        if(t.dataset.indToast){toast(t.dataset.indToast);return}
      });
      document.addEventListener("change",e=>{if(e.target.id==="connection-category"){state.connCat=e.target.value;state.connId=connections[state.connCat][0].id;render()}});
      document.addEventListener("input",e=>{if(!e.target.matches(".search input,.overview-search input"))return;const q=e.target.value.trim().toLowerCase(),root=e.target.closest(".list-pane,.connection-list,.object-list,.feed-pane");root?.querySelectorAll(".matter-item,.conn-item,.object-row,.feed-item").forEach(el=>{el.hidden=q&&!el.textContent.toLowerCase().includes(q)})});
      document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="matter-input"){document.querySelector("[data-ind-send]")?.click()}if(e.key==="Enter"&&e.target.id==="session-input"){document.querySelector("[data-ind-session-send]")?.click()}if(e.key==="Enter"&&e.target.id==="partner-input"){document.querySelector("[data-ind-partner-send]")?.click()}if(e.key==="Enter"&&e.target.id==="quick-note"){document.querySelector("[data-ind-note]")?.click()}});
      window.addEventListener("hashchange",()=>{state.route=initialRoute();render()});
      render();
    })();
  </script>
</body>
</html>
