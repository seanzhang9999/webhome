/* v2.1 value proof: expose the governed operating loop already present in the demo */
.chronic-value-proof{margin:0 0 14px;padding:15px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.chronic-value-proof-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.chronic-value-proof-head h3{margin:0;font:600 16px/1.35 var(--font-display)}
.chronic-value-proof-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.chronic-proof-flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
.chronic-proof-flow span{position:relative;min-width:0;padding:8px 7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:9.5px;font-weight:600;line-height:1.35;text-align:center}
.chronic-proof-flow span:not(:last-child):after{content:"›";position:absolute;top:50%;right:-6px;z-index:2;transform:translateY(-50%);color:var(--muted);background:var(--surface)}
.chronic-proof-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.chronic-proof-card{min-width:0;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-work)}
.chronic-proof-card b{display:block;font-size:10.5px;line-height:1.4}
.chronic-proof-card p{margin:4px 0 0;color:var(--muted);font-size:9.5px;line-height:1.5}
.chronic-proof-card strong{color:var(--accent);font-family:var(--font-mono)}
.chronic-proof-boundary{margin-top:9px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--accent-soft);font-size:10px;line-height:1.5}
@media(max-width:1120px){.chronic-proof-flow{grid-template-columns:repeat(3,minmax(0,1fr))}.chronic-proof-flow span:after{display:none}.chronic-proof-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
