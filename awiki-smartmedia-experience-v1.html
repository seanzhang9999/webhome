function side(){let context=state.scene,sc=scene();let logged=state.login;let a='<div class="agent-top"><div class="side-avatar">✦</div><div><strong>阿维 · AURA</strong><small>用户主权 · 当前环境即时分身</small></div></div><div class="row"><span class="pill '+(state.active?"green":"yellow")+'">'+(state.active?"已唤起（本地模拟）":"待唤起")+'</span><span class="pill purple">'+(logged?"演示 DID 已关联":"匿名访客")+'</span></div>';

a+='<div class="agent-call"><strong>阿维如何帮助你？</strong><p>'+(state.active?"我已围绕当前环境载入模拟上下文。你可以让我解释、保存必要结果，或准备一份需你确认的服务 Board。":"点击“唤起分身”只会加载当前公开内容和受限能力，不会读取其他 App 的私人历史。")+'</p></div>';
a+='<div class="agent-buttons">'+action("wake","✦ 唤起分身","primary full")+action("login",logged?"演示身份已关联":"AWiki DID 登录（演示）","full")+action("save","保存当前工作","full")+action("startquestion","准备服务 Board","full")+'</div>';
a+='<div class="agent-scope"><b>开放配置与节点</b><p>逻辑 AURA 身份：'+(logged?"did:wba:demo.awiki.ai:viewer-01":"未绑定")+'</p><p>云端 Inbox：未连接 · 本地 Agent：未连接 · 外部 PA：按需授权</p><button type="button" data-action="delegate" class="btn full secondary">模拟分布式委托</button></div>';
a+='<div class="agent-log"><strong style="font-size:12px">当前会话轨迹（浏览器本地）</strong>'+(state.auraLog.length?state.auraLog.slice(-4).map(x=>'<div class="entry"><span class="pill">'+esc(x.kind)+'</span><p>'+esc(x.text)+'</p></div>').join(""):'<p class="formhelp">尚未发生分身操作。不会发送给真实模型。</p>')+'</div><p class="bottom-info">用户可以停止分身，工作资产按单独保存和委托规则处理；本示例只在当前浏览器 localStorage 中模拟。</p>';
return a;}
function render(){document.title="AWiki 智媒体 · "+words[state.scene]+" · 可交互示例";$x("left").innerHTML=tabs();let view=state.view;let content=view==="home"?home():view==="interaction"?interactive():view==="board"?boardPage():view==="work"?workPage():view==="agent"?agentPage():adminPage();$x("main").innerHTML=content+'<p class="bottom-info">AWiki Smart Media Prototype v1 · 示例数据/角色/审批皆为模拟。<a href="./awiki-smartmedia-blueprint-v1.html" style="color:#087b73">阅读完整方案与边界 ↗</a></p>';$x("right").innerHTML=side();if(state.view==="agent")drawQR();}
function log(kind,text){state.auraLog.push({kind,text,at:new Date().toISOString()});if(state.auraLog.length>14)state.auraLog=state.auraLog.slice(-14);}
function awake(){state.active=true;log("当前场景",scene().name+"：已加载公开示例内容及本次限定能力。未读取私人会话。");persist();render();show("已唤起受限阿维分身（本地模拟）");}
function login(){if(!state.login){state.login=true;log("身份","已建立虚构 AWiki DID 演示身份，非真实认证。");persist();render();show("已模拟关联用户 DID；没有访问真实账户");}else show("当前已处于模拟登录状态");}
function saveWork(kind){if(!state.login){show("请先模拟登录，再保存到个人 WorkHub");return;}let id="WORK-"+state.seed++;let label=kind==="board"?"Board："+(state.current||scene().topic):scene().topic;let details=state.scene==="ir"?"模拟收入基础 HK$12.6bn；假设增长率 "+state.scenarioState.growth+"%；仅存演示结果，不是投资预测。":state.scene==="creator"?"预算 ¥"+state.scenarioState.budget+"；已有基础工具："+(state.scenarioState.hasTool?"是":"否")+"；非真实商品报价。":state.scene==="product"?"待核验处理器："+state.scenarioState.cpu+"；所选 SKU 的整机 MTM 和正式订单条款尚未确认。":"每日总量承诺与单酒店配额的区分；后台配额及变更记录未取得。";state.work.push({id,scene:state.scene,kind,label,details,createdAt:new Date().toISOString(),source:scene().sources[0][0]});log("保存","已将当前选定内容作为 "+kind+" 保存到浏览器工作区。");persist();render();show("已保存一个模拟 WorkHub 记录");}
function createBoard(){if(!state.temp||state.temp.trim().length<5){show("请先输入至少 5 个字的问题");return;}if(!state.confirmed){show("请先确认本次共享范围");return;}if(!state.login){show("请先模拟登录，以便保持问询与回复的工作关联");return;}let id=(state.scene==="ir"?"IR":state.scene==="creator"?"CR":state.scene==="product"?"PV":"EN")+"-"+new Date().getFullYear()+"-"+String(state.seed++).padStart(3,"0");let b={id,scene:state.scene,sceneTitle:scene().topic,question:state.temp.trim(),source:scene().sources[0][0],pack:"awiki.smartmedia."+state.scene+"@demo-1.0",stage:"submitted",events:[{actor:"用户阿维",kind:"经用户确认提交",text:state.temp.trim()}],answer:""};state.boards.push(b);state.current=id;state.temp="";state.confirmed=false;state.view="board";log("Board","用户批准本次限定范围，已在浏览器创建模拟 "+id+"。");persist();render();show("已创建模拟服务 Board "+id);}
function draftBoard(id){let b=state.boards.find(x=>x.id===id);if(!b||b.stage!=="submitted"||state.admin!=="operator"){show("当前角色或状态不允许起草");return;}b.stage="drafted";b.events.push({actor:"IR 服务商数字员工（模拟）",kind:"候选草稿",text:"已整理公开来源和请求；候选回复等待内容责任方审批。"});persist();render();show("已模拟生成待审批草稿");}
function approveBoard(id){let b=state.boards.find(x=>x.id===id);if(!b||b.stage!=="drafted"||state.admin!=="issuer"){show("必须由发行人审批视角处理待审批草稿");return;}b.stage="answered";b.answer=b.scene==="ir"?"本页为模拟演示，未连接真实上市公司。正式 IR 答复应引用经批准公开的文件和具体来源；无法根据公开材料回答的问题须交授权 IR 人员处理。":b.scene==="creator"?"演示服务商仅确认已收到材料清单请求；商品规格、真实库存、购物车与创作者佣金归因仍需向正式商家系统核实。":b.scene==="product"?"演示中并未取得真实商家回复；所选 SKU 的完整 CPU、整机 MTM 及交付承诺仍需正式确认。":"演示中并未取得权益运营商实际配额与调整日志；无法据此认定已发生权益缩减。";b.events.push({actor:"内容责任方（模拟角色）",kind:"批准演示回复",text:"演示角色切换后形成的模拟回单，非真实公司签名或公告。"});log("Inbox","已收到 "+b.id+" 的模拟回复。真实系统需以可信身份、签名和可投递消息连接。");persist();render();show("模拟答复已生成；投资者可以返回 Board 查看");}
function delegate(){if(!state.login){show("委托需先模拟绑定个人工作身份");return;}let id="DLG-"+String(state.seed++).padStart(3,"0");state.delegations.push({id,task:"围绕「"+scene().topic+"」进行公开资料分析，返回来源说明与可复用工件；不得对外发送、下单或读取私人资料。",status:"prepared-only",createdAt:new Date().toISOString()});log("委托","已准备一份未实际发送的授权委托："+id+"。");persist();render();show("模拟委托已创建；没有调用外部 Agent");}
function exportData(){let output={exported_at:new Date().toISOString(),demo:true,identity:state.login?"demo-awiki-user":"anonymous",work:state.work,boards:state.boards,delegations:state.delegations};let blob=new Blob([JSON.stringify(output,null,2)],{type:"application/json;charset=utf-8"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="awiki-demo-work-export.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);show("已导出本地模拟数据");}
async function copyText(t){try{await navigator.clipboard.writeText(t);show("已复制到剪贴板");}catch(err){let el=document.createElement("textarea");el.value=t;document.body.append(el);el.select();let ok=document.execCommand("copy");el.remove();show(ok?"已复制":"当前浏览器不允许复制，请手动选择文本");}}
const QRDATA="AAAAAAAAAAAAAA/i6t6/hBHcs9BC6u5wa6F1dKTl0LrqOUroQURXDQQ/qqqq/gAbQ9IAC+IiPz4BhDwZS4IuQZHoYBG1W3qQBk7ax/gUT3+UgCDK8oV2AyWvovIIZ9kOegADC/oJgI5Wunphg4ZebBAL3VPWoBKzWpQgDdNrLfYfBxPk8wa44x56B6Uu60oCzfkAbOFLERhsII7QQM/gAGE81GA/nvKSrhBdPJEaC645v/uF1lvK9ULrJgggYQRmCX0Q/q9TQvgAAAAAAAAAAAAAAA==";
function drawQR(){let c=$x("realqr");if(!c)return;let ctx=c.getContext("2d");if(!ctx)return;ctx.fillStyle="white";ctx.fillRect(0,0,164,164);let raw=atob(QRDATA);let n=41;ctx.fillStyle="#142b38";for(let i=0;i<n*n;i++){if(raw.charCodeAt(Math.floor(i/8))&(1<<(7-(i%8))))ctx.fillRect((i%n)*4,Math.floor(i/n)*4,4,4);}}
document.addEventListener("click",function(e){
let b=e.target.closest("[data-scene]");if(b){chooseScene(b.dataset.scene);return;}
let nav=e.target.closest("[data-nav]");if(nav){state.view=nav.dataset.nav;if(state.view!=="board")state.current=null;persist();render();window.scrollTo({top:0,behavior:"smooth"});return;}
let r=e.target.closest("[data-role]");if(r){state.admin=r.dataset.role;persist();render();return;}
let board=e.target.closest("[data-board]");if(board){state.current=board.dataset.board;state.view="board";persist();render();return;}
let a=e.target.closest("[data-action]");if(!a)return;
let key=a.dataset.action;
if(key==="wake"){awake();return;}
if(key==="login"){login();return;}
if(key==="reset"){if(!confirm("只删除本浏览器中的 AWiki 智媒体演示状态？不会影响真实账户或 GitHub 数据。"))return;state=initial();persist();render();show("已重置本地演示");return;}
if(key==="goagent"){state.view="agent";persist();render();return;}
if(key==="gointeraction"){state.view="interaction";persist();render();return;}
if(key==="goadmin"){state.view="admin";persist();render();return;}
if(key==="save"){saveWork("artifact");return;}
if(key==="saveBoard"){saveWork("board");return;}
if(key==="startquestion"){state.view="board";state.current=null;state.temp="";state.confirmed=false;persist();render();return;}
if(key==="newboard"){state.current=null;state.temp="";state.confirmed=false;persist();render();return;}
if(key==="prepare"){let t=$x("question")?.value||"";if(t.trim().length<5){show("请输入具体问题，至少 5 个字");return;}state.temp=t.trim();state.confirmed=false;persist();render();return;}
if(key==="cancelprepare"){state.temp="";state.confirmed=false;persist();render();return;}
if(key==="submit"){createBoard();return;}
if(key.indexOf("draft:")===0){draftBoard(key.slice(6));return;}
if(key.indexOf("approve:")===0){approveBoard(key.slice(8));return;}
if(key==="delegate"){delegate();return;}
if(key==="export"){exportData();return;}
if(key==="source"){show("这是演示资料，没有外部真实资料接口；实际版需链接获准原文及版本。");return;}
if(key==="copyUrl"){copyText(PATH+"?case="+state.scene);return;}
if(key==="copyPrompt"){copyText("请访问 AWiki 智媒体演示："+PATH+"?case="+state.scene+"。请核实所有来源属于演示，不要把虚构财务数据当作真实上市公司公告。请阅读公开内容，指出原文与推论的区别。若要请求受保护操作，请先获得我的单独授权。");return;}
if(key==="copyManifest"){copyText(JSON.stringify(agentManifest(),null,2));return;}
});
document.addEventListener("change",function(e){
if(e.target.id==="consent"){state.confirmed=e.target.checked;persist();}
if(e.target.id==="hasTool"){state.scenarioState.hasTool=e.target.checked;persist();render();}
if(e.target.id==="cpu"){state.scenarioState.cpu=e.target.value;persist();render();}
});
document.addEventListener("input",function(e){
if(e.target.id==="growthRange"){let g=Number(e.target.value);state.scenarioState.growth=g;$x("growthLabel").textContent=g+"%";$x("growthResult").innerHTML="纯数学情景：HK$12.6bn × (1 + "+g+"%) ≈ <b>HK$"+(12.6*(1+g/100)).toFixed(2)+"bn</b>；不代表企业预测。";persist();}
if(e.target.id==="budget"){let v=Number(e.target.value);state.scenarioState.budget=v;$x("budgetNum").textContent=v;let need=state.scenarioState.hasTool?299:379;$x("budgetResult").innerHTML="建议材料总价（演示）<strong>¥"+need+"</strong> · "+(v>=need?"在预算内":"超出预算，不能直接推荐购买");persist();}
});
const caseQ=new URLSearchParams(location.search).get("case");if(caseQ&&scenes[caseQ])state.scene=caseQ;persist();render();
})();
</script></body></html>
