function conversation(){const history=selected!==E[s.cursor].g,records=E.slice(0,s.cursor+1).filter(e=>e.g===selected);return `<div class="three">${leftWork()}<main class="chat">${matterHead()}<div class="chat-body" id="chatScroll" data-group="${selected}"><div class="timeline"><div class="stage">V4 · 输入、产出与共同工作 Board · 预置模拟 · 与V1/V2独立存储 · 不连接真实实验设备</div>${records.map((e)=>`${e.chapter?`<div class="chapter">${esc(e.chapter)}</div>`:''}${currentRecord(e)}${e.id==='COF-EV-001'?`<div class="v51-system-status">◉ AWiki 系统状态 · 该输入已关联 PET 研发需求事项；事项名称由系统建议，可由用户修改。这不是张研填写的消息标题。</div>`+boardReference('spec'):''}${e.gate&&s.boards[e.gate]?boardReceipt(e):''}${e.gate==='accept'?acceptReceipt():''}${e.gate==='execute'?executionReceipt():''}${e.gate==='execute'&&s.execution?`<div class="notice-block"><b>模拟数值已产生，但尚不是科学检测结论。</b>${resultsTable()}</div>`:''}`).join('')}${s.notes.filter(x=>x.kind==='group'&&x.g===selected).map(n=>`<article class="msg mine" id="group-note-${esc(n.id||'legacy')}">${avatar(n.role==='client'?'customer':n.role==='lab'?'tech':'user')}<div class="msgcontent"><div class="metadata"><strong>${esc(n.actor||'张研')}</strong><span>${n.boardId?'关联 Board 的讨论':n.mode==='change'?'变更建议':'群内讨论'} · 本地模拟</span></div><div class="bubble"><p>${esc(n.text)}</p>${n.boardId?`<button type="button" class="attachment board" data-action="openboard:${esc(n.boardId)}">▣ 已关联 ${esc(BOARDS[n.boardId]?.title||n.boardId)} · 查看协作记录 ↗</button>`:''}</div><div class="proof">${esc(n.id||'历史演示留言')} · ${n.boardId?'讨论同步登记 Board，不自动修改已确认事实':'仅为群聊，不改变任务授权'}</div></div></article>`).join('')}${history?`<div class="advance"><p>历史群可回看，不会借此重新批准或更改执行范围。</p>${btn('返回当前事项','current','primary')}</div>`:gateInChat()}</div></div><div class="chat-jump" id="chatJump" hidden>${btn("↓ 返回最新消息","latest","mini primary")}</div><footer class="chat-compose v51-compose"><form id="groupForm" class="v51-compose-form"><div class="v51-compose-options"><label>提交方式 <select id="groupSubmitMode" ${history?'disabled':''}><option value="chat">群内讨论（不关联 Board）</option><option value="comment">引用 Board · 讨论/补充</option><option value="question">引用 Board · 待回答问题</option><option value="change">引用 Board · 变更建议（待复核）</option></select></label><label>关联对象 <select id="groupBoardTarget" ${history?'disabled':''}><option value="">不关联</option>${Object.keys(s.boards).filter(id=>BOARD_META[id]&&(BOARD_META[id].originGroup===selected||BOARD_META[id].originGroup===selected-1)).map(id=>`<option value="${esc(id)}">${esc(BOARDS[id].title)}</option>`).join('')}</select></label></div><div class="v51-compose-input"><input id="groupInput" type="text" maxlength="1000" placeholder="在事项群直接讨论；需要时选择关联 Board…" ${history?'disabled':''} aria-label="群内讨论内容"/><button class="btn mini primary" ${history?'disabled':''} type="submit">发送到事项群</button></div></form><div class="compose-foot">群内讨论可同步关联 Board，并保留消息来源；变更建议不会自动修改共同事实或签收版本。快捷键 <kbd>N</kbd> 仅推进非审批事件。</div></footer></main>${partner()}</div>`;}
function partnerGuidance(){if(view==='work'&&workTab==='resources'){const obj=workObjects()[objectIndex];if(obj?.artifact){const a=ARTIFACTS[obj.artifact];return '这份'+a.level+'工件是任务输出；请先核对来源与可用范围。A2A输出内容和AWiki长期工作记录分开显示，跨组织委托需看对应Board。';}return '资源包括来源、任务工件和Board。它们不是同一对象；资源本身也不授予执行权限。';}if(view==='work'&&workTab==='topics')return '专题收录应由你明确确认，引用工件并保留来源；模拟结果只能作为演示案例，不能被我自动写成科研事实。';if(view==='work'&&workTab==='solutions')return '方案配置任务Schema和能力，不能把本次实验参数和模拟结果直接当成通用模板。我可以帮助提炼结构，但由你批准保存草案。';const e=E[s.cursor],inCurrent=view==='work'&&workTab==='matters'&&selected===e.g;const piece=!inCurrent?'私人 AI 伙伴依你正在查看的对象给出背景说明；普通会话、连接和能力目录不会自动授予科研执行权限。':

 '目前没有必须由你本人审批的关口。我可以帮你回看证据、理解当前专业Agent结论，必要时建议你寻求专业复核。';

if(view==='awiki')return `<header><div class="eyebrow">AWIKI · 知识与专业能力空间</div><h1>发现知识与能力</h1><p>这里可以发现材料知识、科研 Agent 和可安装方案。实际调用依赖授权，安装能力也不会自动创建或操作科研事项。</p></header><div class="grid">${[['材数智元 · 材料知识底座','项目方提出20亿材料数据的能力规模；Demo未核验数据质量与接口。','data'],['CaiMat-L1 · 材料科研模型','提供L0–L7科研能力的业务侧说明；当前仅运行预置示例。','flow'],['合作实验室 · 设备能力','统一任务协议适配人工或设备；暂无真实PLC/OPC-UA/仪器连接。','lab'],['PET 聚酯弹性体协同方案','科研方案已作为工作域中的方案示范安装。','v02']].map(([t,d,k])=>`<article class="tile"><span class="pill gray">能力卡 · 演示</span><h3>${t}</h3><p>${d}</p>${btn('查看来源说明','source:'+k,'mini')}${k==='v02'?btn('进入工作方案','solution','mini primary'):''}</article>`).join('')}</div><h2>能力发现如何进入工作</h2><div class="grid"><div class="tile"><h3>发现 Agent / 数据能力</h3><p>在 AWiki 能力目录中找到材数智元及合作实验室，连接只建立可发现关系。</p>${btn('查看连接目录','connections','mini')}</div><div class="tile"><h3>安装专业方案</h3><p>将科研能力、工件 Schema 与任务模板配置到「工作 → 方案」，实际调用仍由事项授权。</p>${btn('查看已安装方案','solution','mini primary')}</div><div class="tile wide"><h3>使用后的工件去向</h3><p>Agent 输出保存在工作资源；专题选择性引用；方案只提炼可复用 Schema。公共能力目录不自动获得客户实验数据。</p>${readyArtifacts().length?btn('查看已生成工件','artifact:'+readyArtifacts().at(-1),'mini'):''}</div></div><h2>采用边界</h2><div class="tile"><p>公开知识可通过目录发现；私人数据须来源许可、委托范围和留痕。真实跨域验证、授权策略执行与设备接入不在本地Demo范围内。</p></div>`;

function workDocument(){const obj=workObjects()[objectIndex]||workObjects()[0];if(!obj)return `<div class="main-page"><h1>暂无${NAMES[workTab]}内容</h1><p>当前筛选下没有可用对象。可返回事项推进后再查看。</p></div>`;if(workTab==='resources'){if(obj.artifact)return artifactBody(obj.artifact);if(obj.source)return sourceBody(obj.source);if(obj.board)return boardBody(obj.board);}if(workTab==='topics')return topicBody(obj.topic);return solutionBody();}
function sourceBody(id){const d=SOURCES[id];return `<div class="eyebrow">WORK / RESOURCE · SOURCE-GROUNDED</div><h1>${esc(d.title)}</h1><p><span class="pill gray">${esc(d.type)}</span></p><div class="tile"><h3>来源内容摘要</h3><ul class="doc-lines">${d.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><h2>业务使用与边界</h2><div class="warning-line">资源不是执行命令。原始文件与方案建议可能存在不同口径，必须在事项交接中确认。</div>${btn('回到当前事项','current','mini primary')}`;}
function boardStatus(id){const b=s.boards[id];return b?.status==='confirmed'?'已形成确认快照 · 可继续协作':'共同维护中 · 待交接确认';}
function boardReference(id){const b=s.boards[id],m=BOARD_META[id];if(!b||!m)return '';return `<div class="board-inline-ref" data-board-ref="${id}"><div class="board-inline-icon">▣</div><div class="board-inline-text"><b>${esc(BOARDS[id].title)}</b><p>共同工作对象 · ${esc(m.uid)} · ${esc(boardStatus(id))}</p><small>客户与研发方共同维护目标、来源、待解决问题和确认；不是一张审批表。</small></div>${btn('进入 Board','openboard:'+id,'mini primary')}</div>`;}
function boardSourceKey(id){return ({spec:'req','design-handoff':'audit','experiment-handoff':'tc01','result-handoff':'result'})[id];}
function boardActivity(id){const b=s.boards[id];const m=BOARD_META[id];const initial=m.seed.filter((x,i)=>id!=='spec'||i===0||s.cursor>=2).map(([actor,text],i)=>({type:'seed',actor,text,at:i?'D1 09:05':'D1 09:00'}));return [...initial,...(b.activity||[])];}
function boardDecisionSection(id){const b=s.boards[id],d=BOARDS[id],m=BOARD_META[id];if(id==='spec'&&s.cursor<1)return `<section class="board-panel"><h3>需求基线等待 L0 自动对照</h3><p>这份委托 Board 在发现异常前已经建立；L0 完成来源核对后，再决定是否需要澄清或确认口径。</p></section>`;if(b.status==='confirmed')return `<section class="board-panel"><div class="board-panel-head"><h3>已冻结的协作确认快照</h3><span class="pill green">V${b.frozenVersion||b.version||1} · 已确认</span></div><p>结论：${esc(d.choices.find(x=>x.id===b.choice)?.title||b.choice)}。此结论已作为模拟回单写回来源事项；后续评论不会覆盖这个已确认版本。</p><div class="board-signers">${(b.acks||[]).map(x=>`<div class="board-signer done">✓ ${esc(m.approvers.find(a=>a[0]===x)?.[1]||x)} · 演示签收</div>`).join('')}</div><p class="board-muted">签名、DID与角色在此均为预置模拟。真正的跨组织确认需要独立身份验证与签名。</p></section>`;
return `<section class="board-panel" id="boardDecision"><div class="board-panel-head"><h3>本次交接的待确认决定</h3><span class="pill amber">需要明确双方角色</span></div><p>${esc(d.question)}</p><div class="board-options">${d.choices.map(c=>`<label class="radio-row"><input type="radio" name="board-choice" data-board="${id}" value="${esc(c.id)}" ${b.draftChoice===c.id?'checked':''}/><span><b>${esc(c.title)}</b><small>${esc(c.desc)}</small></span></label>`).join('')}</div><div class="board-signer-wrap"><h4>参与主体签收（演示）</h4><p>先选择结论，再由双方角色分别模拟签收。签收不等于真实账号登录或数字签名。</p><div class="board-signers">${m.approvers.map(([who,label])=>`<div class="board-signer ${b.acks?.includes(who)?'done':''}"><b>${esc(label)}</b>${b.acks?.includes(who)?'<span>✓ 已模拟签收</span>':btn(roleForSigner(who)===currentRole?'确认本方责任':'等待对应主体', 'boardack:'+id+':'+who,'mini',b.draftChoice&&roleForSigner(who)===currentRole?'':'disabled')}</div>`).join('')}</div></div><div class="board-muted">各方只能在自己的客户端确认本方责任；全部确认齐备后由系统自动生成本次交接快照和回单，不需要任何人代替双方点击。</div><div class="board-muted">可直接在事项群中提出讨论或变更并关联本 Board；未签收时按 N 不会跨过本关口。</div></section>`;}
function boardActivityPanel(id){const b=s.boards[id];const entries=boardActivity(id);return `<section class="board-panel"><div class="board-panel-head"><h3>持续协作记录</h3><span class="pill gray">${entries.length} 条 · 含演示预置</span></div><p>这里是围绕工作事实的多轮讨论与补充，不是只有“批准/拒绝”的一次性表单。</p><div class="board-activity">${entries.map((x,i)=>`<article class="board-activity-item"><div class="board-activity-dot">${x.type==='confirm'?'✓':x.type==='change'?'△':x.type==='ack'?'↗':'•'}</div><div><div class="board-activity-meta"><b>${esc(x.actor)}</b><span>${esc(x.at||'演示记录')} · ${esc(x.type==='seed'?'预置示例':x.type==='change'?'修改建议':x.type==='ack'?'模拟签收':x.type==='confirm'?'确认快照':x.type==='create'?'创建':'讨论')}</span></div><p>${esc(x.text)}</p>${x.sourceMessageId?`<button type="button" class="v51-backlink" data-action="v51-jump:${esc(x.sourceMessageId)}">↗ 返回来源事项群消息 · ${esc(x.sourceMessageId)}</button>`:''}</div></article>`).join('')}</div></section><section class="board-panel"><h3>添加讨论 / 提出修改</h3><p>也可以直接在来源事项群中选择「引用 Board」提交讨论；这里的输入用于 Board 内补充。当前操作主体由模拟客户端角色决定，内容只保存在浏览器。</p><form id="boardCommentForm" data-board="${id}"><label class="board-label" for="boardCommentType">记录类型</label><select id="boardCommentType"><option value="comment">补充说明 / 讨论</option><option value="question">提出待答问题</option><option value="change">提出版本变更建议</option></select><label class="board-label" for="boardCommentText">内容</label><textarea id="boardCommentText" rows="4" maxlength="1200" placeholder="补充实验背景、提出问题，或建议修订某个共同事实…" required></textarea><div class="actions"><button class="btn primary" type="submit">记录到本 Board</button></div></form><div class="board-muted">已冻结的确认版本不会因新评论自动改变；需要重新确认的修改将形成待处理变更。</div></section>`;}
function boardEvidencePanel(id){const b=s.boards[id],m=BOARD_META[id],source=boardSourceKey(id);return `<section class="board-panel"><h3>来源、版本和审计轨迹</h3><div class="info-kv"><span>Board 标识</span><span>${esc(m.uid)}</span></div><div class="info-kv"><span>业务版本</span><span>V${b.version||1}${b.frozenVersion?' · 已确认 V'+b.frozenVersion:''}</span></div><div class="info-kv"><span>协作记录修订</span><span>r${b.revision||1} · 不自动改动冻结版本</span></div><div class="info-kv"><span>来源事项</span><span>${esc(GROUPS[m.originGroup].name)} · ${esc(E[m.originEvent].id)}</span></div><div class="info-kv"><span>来源材料</span><span>${esc(BOARDS[id].source)}</span></div><div class="info-kv"><span>权限</span><span>${esc(BOARDS[id].scope)}</span></div><div class="actions">${btn('打开来源材料','source:'+source,'mini')}${btn('回看发起事件','sourceevent:'+m.originEvent,'mini')}</div></section><section class="board-panel"><h3>待解决问题与版本变更</h3>${(id==='spec'&&s.cursor<2?[]:m.issues).map(([title,desc])=>`<div class="board-issue"><span class="pill amber">需讨论</span><b>${esc(title)}</b><p>${esc(desc)}</p></div>`).join('')}${(b.changeRequests||[]).map((x,i)=>`<div class="board-issue"><span class="pill amber">变更建议 ${i+1} · 未冻结</span><p>${esc(x.text)}</p></div>`).join('')}${b.status==='confirmed'?'<p class="board-muted">原确认快照继续保留；新变更需要另行审阅并建立新版本，本演示不自动重新授权下游任务。</p>':''}</section>`;}
function boardAccessPanel(id){const m=BOARD_META[id],b=s.boards[id];return `<section class="board-panel"><h3>主体、身份与治理边界</h3>${[['发起主体',m.initiator],['控制主体',m.controller],['受托创建执行者',m.creator],['承接主体',m.recipient],['允许共享范围',BOARDS[id].scope]].map(([k,v])=>`<div class="info-kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}<h4>参与者</h4><div class="board-members">${m.members.map(w=>`<span class="board-member">${avatar(w)} ${esc(ACTORS[w].name)} · ${esc(ACTORS[w].org)}</span>`).join('')}</div><div class="warning-line">Board 的控制主体、发起主体和执行 Agent 是不同概念。此演示没有真实 ANP / OVAIM、DID 登录、授权校验或数字签名。</div></section><section class="board-panel"><h3>Board 独立链接</h3><p>此页面在「工作 → 资源 → 共同Board」下统一索引；链接指向 Board 标识，而不是一次审批弹窗。</p><code class="board-url">${esc(boardLink(id))}</code><div class="actions">${btn('复制 Board 链接','boardcopy:'+id,'mini primary')}</div><p class="board-muted">当前是纯前端本地演示，其他浏览器没有共享数据库；独立链接只验证对象定位，不代表跨设备数据同步或访问授权已实现。</p></section>`;}
function boardBody(id){const b=s.boards[id],m=BOARD_META[id],d=BOARDS[id];if(!b)return '<h1>Board 尚未创建</h1>';const tabs=[['overview','共同事实'],['discussion','协作记录'],['evidence','版本与证据'],['access','主体与权限']];return `<div class="board-workspace" data-board-workspace="${id}"><div class="board-topline"><span class="eyebrow">WORK / RESOURCES / BOARD · ${esc(m.uid)}</span><span class="pill ${b.status==='confirmed'?'green':'amber'}">${esc(boardStatus(id))}</span></div><h1>${esc(d.title)}</h1><p class="board-intro">${esc(m.purpose)}</p><div class="board-vs-oa"><b>Board 不等于一次性 OA 审批单</b><p>双方持续维护事实、讨论、版本、工件引用与责任；签收只是局部动作。若只有批准/拒绝，就与 OA 没有本质区别。</p></div><div class="board-top-actions">${btn('← 返回来源事项','boardreturn','mini')}${btn('复制独立链接','boardcopy:'+id,'mini')}${btn('查看源事项','sourceevent:'+m.originEvent,'mini')}</div><div class="board-owner-grid"><div><small>发起 / 控制主体</small><b>${esc(m.initiator)}</b><span>${esc(m.controller)}</span></div><div><small>承接主体</small><b>${esc(m.recipient)}</b><span>执行者：${esc(m.creator)}</span></div></div><nav class="board-tabs" aria-label="Board 工作区">${tabs.map(([k,label])=>`<button type="button" data-action="boardtab:${k}" class="${boardTab===k?'active':''}">${label}</button>`).join('')}</nav>${boardTab==='overview'?`<section class="board-panel"><div class="board-panel-head"><h3>共同维护的事实基线</h3><span class="pill gray">来源可追溯 · 未实测</span></div><div class="board-facts">${m.facts.map(([label,text])=>`<div class="board-fact"><small>${esc(label)}</small><p>${esc(text)}</p></div>`).join('')}</div></section><section class="board-panel"><div class="board-panel-head"><h3>需要协作处理的问题</h3><span class="pill amber">${id==='spec'&&s.cursor<2?'等待L0对照':m.issues.length+' 项 · 来源对照'}</span></div>${(id==='spec'&&s.cursor<2?[]:m.issues).map(([label,text])=>`<div class="board-issue"><b>${esc(label)}</b><p>${esc(text)}</p></div>`).join('')}<div class="actions">${btn('查看协作记录并讨论','boardtab:discussion','mini')}</div></section>${boardDecisionSection(id)}`:boardTab==='discussion'?boardActivityPanel(id):boardTab==='evidence'?boardEvidencePanel(id):boardAccessPanel(id)}<div class="board-footer"><span>Board 独立于事项持续存在 · 事项群仅引用其动态与回单</span>${btn('返回来源事项','boardreturn','mini primary')}</div></div>`;}
function topicBoardReferences(topic){const available=Object.keys(s.boards).filter(k=>BOARD_META[k]&&(topic==='process'?['spec','design-handoff','experiment-handoff'].includes(k):['experiment-handoff','result-handoff'].includes(k)));const pins=(s.topicBoardPins||{})[topic]||[];return available.length?available.map(k=>`<div class="cross-link"><h3>${esc(BOARDS[k].title)}</h3><p>${esc(BOARD_META[k].uid)} · ${esc(boardStatus(k))}。专题只建立引用，不接管Board控制权。</p><div class="actions">${btn('打开共享Board','openboard:'+k,'mini')}${pins.includes(k)?btn('撤销专题引用','boardunpin:'+topic+':'+k,'mini'):btn('收录Board引用','boardpin:'+topic+':'+k,'mini primary')}</div></div>`).join(''):'<p>暂无可引用的 Board。</p>';}
function pinBoardToTopic(topic,id){if(!BOARD_META[id]||!s.boards[id]||!['process','experiment'].includes(topic))return;s.topicBoardPins=s.topicBoardPins||{process:[],experiment:[]};s.topicBoardPins[topic]=s.topicBoardPins[topic]||[];if(!s.topicBoardPins[topic].includes(id))s.topicBoardPins[topic].push(id);save();notify('专题已保存Board引用；未转移控制权或复制内容。');}
function unpinBoardFromTopic(topic,id){s.topicBoardPins=s.topicBoardPins||{};s.topicBoardPins[topic]=(s.topicBoardPins[topic]||[]).filter(x=>x!==id);save();notify('已撤销专题引用；Board 本身不受影响。');}

function topicBody(topic){const relevant=E.slice(0,s.cursor+1).filter(e=>topic==='process'?['L0','L1','L2','L3','L4','L5'].includes(e.lvl):['L6','L7','L7→L4'].includes(e.lvl));const ids=readyArtifacts().filter(id=>ARTIFACTS[id].topic===topic);const pins=(s.topicPins||{})[topic]||[];const title=topic==='process'?'PET聚酯弹性体技术路线':'实验质量与结果回流';return `<div class="eyebrow">WORK / TOPIC · CROSS-MATTER EVIDENCE</div><h1>${title}</h1><p>专题组织跨事项知识与证据引用，不产生新的实验执行权限。Agent可推荐工件，是否收录由人决定；一次性任务卡不会因此被复制成新文件。</p><div class="actions">${btn("返回当前事项","current","mini primary")}</div><div class="metric-row"><div class="metric"><b>${ids.length}</b><span>候选工件</span></div><div class="metric"><b>${pins.length}</b><span>已明确收录</span></div><div class="metric"><b>${relevant.length}</b><span>关联事项事件</span></div></div><h2>已收录 · 可追溯的专题引用</h2><div class="tile">${pins.length?pins.filter(id=>artifactReady(id)).map(id=>`<div class="cross-link"><h3>${esc(ARTIFACTS[id].title)}</h3><p>${['result','evaluation','nextplan'].includes(id)?'已按模拟案例收录，不是实际科研证据。':'保留原工件ID、来源与当前业务状态，不复制内容。'}</p><div class="actions">${btn('查看工件','artifact:'+id,'mini primary')}${btn('撤销专题引用','unpin:'+topic+':'+id,'mini')}</div></div>`).join(''):'<p>尚无人工确认的专题引用。下方可从已产生的工件中选择收录。</p>'}</div><h2>Agent 推荐 · 待人工收录</h2><div class="tile">${ids.filter(id=>!pins.includes(id)).length?ids.filter(id=>!pins.includes(id)).map(id=>`<div class="cross-link"><span class="pill gray">${esc(ARTIFACTS[id].level)} · ${esc(artifactStatus(id))}</span><h3>${esc(ARTIFACTS[id].title)}</h3><p>${esc(ARTIFACTS[id].subtitle)}</p><div class="actions">${btn('核对来源','artifact:'+id,'mini')}${btn(['result','evaluation','nextplan'].includes(id)?'收录为模拟案例':'确认收录为专题引用','pin:'+topic+':'+id,'mini primary')}</div></div>`).join(''):'<p>当前没有待收录的已生成工件。可以继续事项演示。</p>'}</div><h2>跨事项引用的 Board（只存引用，不转移控制权）</h2><div class="tile">${topicBoardReferences(topic)}</div><h2>关联事项事实（不等于已收录结论）</h2><div class="tile">${relevant.length?relevant.map(e=>`<button class="source-row" type="button" data-action="sourceevent:${E.indexOf(e)}"><span class="pill gray">${e.lvl}</span><span><strong>${esc(e.title)}</strong><small>${esc(GROUPS[e.g].name)} · ${esc(e.time)}</small></span></button>`).join(''):'<p>当前还没有此专题可引用的事项记录。</p>'}</div>`;}
function solutionBody(){const schema=[['L0','RequirementArtifact','结构化需求、来源、冲突及确认状态'],['L4','ExperimentPlanArtifact','样品矩阵、资源约束、依赖与风险'],['L5','ExperimentTaskArtifact','输入/步骤/参数/停止条件/回单字段'],['L6','ExperimentResultArtifact','操作记录、样品、原始证据与异常'],['L7','EvaluationArtifact','判据比对、缺失项与下一轮建议']];const promoted=(s.templates||[]).includes('tc01-schema-v1');return `<div class="eyebrow">WORK / SOLUTION · INSTALLED PACK</div><h1>材数智元 · 材料科研协同方案</h1><p>方案定义可复用的 Agent 能力、任务 Schema、角色与交接规则。它不是某个具体实验的工件仓库，更不是 AWiki 全局导航。</p><div class="metric-row"><div class="metric"><b>8</b><span>专业 L 模块</span></div><div class="metric"><b>${readyArtifacts().length}</b><span>已产生任务工件</span></div><div class="metric"><b>${s.created.length}</b><span>动态事项群</span></div></div><h2>方案与流程引擎的区别</h2><div class="tile"><h3>方案是业务能力与协同规则包，而非另一套流程引擎</h3><p>流程引擎负责调度、分支、重试与等待；本方案还定义专业 Agent、任务语义、人员/设备能力、跨主体授权、Board 模板、输出工件及验收规则。可复用现有流程引擎，无须 AWiki 重造调度器。</p></div><h2>方案内定义的工件契约</h2><div class="tile"><div class="table-wrap"><table class="data-table"><thead><tr><th>模块</th><th>输出 Schema</th><th>必备业务语义</th></tr></thead><tbody>${schema.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><p class="note">Schema 负责业务语义；A2A Artifact 可承载输出；AWiki Record 负责工作关联、权限、版本和验收。</p></div><h2>从实例提炼方案模板（需要明确决定）</h2><div class="tile"><h3>TC-01 实验任务卡 → 可复用实验任务 Schema</h3><p>只提取字段结构、校验规则、执行前置条件和回单契约，不将客户配方、单次模拟结果或跨组织授权一并复制。</p><span class="pill ${promoted?'green':'amber'}">${promoted?'已保存为草案模板 · 待专家审核':'尚未提炼 · 不自动学习成方案'}</span><div class="actions" style="margin-top:10px">${artifactReady('tc01')?btn('查看任务卡实例','artifact:tc01','mini'):btn('先完成 L5 生成任务卡','current','mini')}${artifactReady('tc01')&&!promoted?btn('人工确认提炼 Schema 草案','promote:tc01','mini primary'):''}${promoted?btn('撤回草案模板','unpromote:tc01','mini'):''}</div></div><h2>Board 模板与创建规则</h2><div class="grid">${BOARD_TEMPLATES.map(([name,desc])=>`<div class="tile"><h3>${esc(name)}</h3><p>${esc(desc)}</p><span class="pill gray">方案模板 · 不是本次实例</span></div>`).join('')}</div><h2>方案配置与运行</h2><div class="module-strip">${['L0 需求/增强','L1 筛选','L2 机理','L3 决策','L4 规划','L5 方案','L6 操作','L7 回流'].map(m=>`<span class="module">${m}</span>`).join('')}</div><div class="tile"><h3>L0–L7 的输入输出及人的责任</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>模块</th><th>输入</th><th>输出工件</th><th>人的作用</th></tr></thead><tbody>${MODULE_IO.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table></div></div><h2>协同策略</h2><div class="grid"><div class="tile"><h3>Agent → Agent</h3><p>同一授权域内 L4→L5 可以直接传 A2A Artifact，无须为每一步都创建 Board。</p>${artifactReady('plan')?btn('查看 L4 工件','artifact:plan','mini'):''}</div><div class="tile"><h3>跨机构/人工交接</h3><p>L5→实验室等需要责任确认时建立 Board；Board 引用工件，不替代事项群。</p>${artifactReady('tc01')?btn('查看 L5 任务卡','artifact:tc01','mini'):''}</div><div class="tile wide"><h3>AI 学徒 → 受控自治</h3><p>第一阶段由人接单并核对SOP，AI伙伴帮助理解与反馈；第二阶段由经授权的适配器处理可自动化设备。任何升级都不自动获得新的设备权限。</p></div></div><h2>演示入口</h2>${btn('进入当前研发事项','current','primary')} ${btn('查看来源流程','source:flow','mini')}`;}
function workSecondary(){return `<div class="three">${leftWork()}<main class="main-page">${workDocument()}</main>${partner()}</div>`;}
function modalBoard(key){return '<p>Board 已迁移到「工作 → 资源 → 共同Board」的独立工作空间。</p>';}
function membersModal(){const g=GROUPS[selected];return `<div class="modal-head"><div><div class="eyebrow">MATTER MEMBERS</div><h2>${esc(g.name)} · 群成员</h2></div>${btn('✕','close','mini')}</div><div class="modal-main"><p>动态事项按本次任务的责任需要组织人员和Agent；私人AI伙伴不作为群成员。</p>${g.members.map(id=>`<div class="info-kv" style="grid-template-columns:40px 1fr">${avatar(id)}<span><strong>${esc(ACTORS[id].name)}</strong><br>${esc(ACTORS[id].role)} · ${esc(ACTORS[id].org)}</span></div>`).join('')}<div class="warning-line">连接身份与执行授权是两个步骤。不同事项群不自动共享全部上下文。</div></div><div class="modal-actions">${btn('关闭','close','primary')}</div>`;}
function acceptModal(){return `<div class="modal-head"><div><div class="eyebrow">HUMAN TASK / L6</div><h2>王工 · 接收 TC-01 实验任务</h2></div>${btn('✕','close','mini')}</div><div class="modal-main"><p>AI 伙伴帮助人工执行人快速理解标准任务并组织自然反馈。接受任务是人工行为，不等于实际已经开展物理实验。</p><div class="tile"><h3>任务速览</h3><ul class="doc-lines"><li>样品：A1 / A2 / A3，PTMG梯度 10–12% / 15–18% / 20–22%。</li><li>目标：评价硬度、维卡、流动性、回弹与尺寸稳定之间的关系。</li><li>执行前：核对SOP、现场人员权限、设备状态、原料批号及停止条件。</li><li>回单：样品、参数、设备/人员、测量原始文件及异常原因。</li></ul></div><div class="form-line"><label for="humanReply">给群内的自然语言回复（仅演示）</label><textarea id="humanReply">收到TC-01任务。我将先核对SOP、原料批次、设备状态和安全边界，按批准范围执行；如果出现偏差会立即暂停并在本群提交证据和原因。</textarea></div><div class="note">私人伙伴建议可以改写；只有用户点击“确认接受”才在群里留下具名回单。</div></div><div class="modal-actions">${btn('暂不接受','close')}${btn('确认由王工接受任务','confirm-accept','primary')}</div>`;}
function execModal(){return `<div class="modal-head"><div><div class="eyebrow">EXPERIMENT TASK / TC-01</div><h2>L6 · 选择本次执行路径</h2></div>${btn('✕','close','mini')}</div><div class="modal-main"><p>同一个标准任务协议支持人工操作或设备 Adapter。此处两条路径都是本地模拟，没有真实仪器、设备控制或实验数据连接。</p><div class="seg" role="group" aria-label="执行模式"><button type="button" data-mode="manual" class="${s.runMode==='manual'?'active':''}">♙ 人工实验员 + AI 伙伴</button><button type="button" data-mode="device" class="${s.runMode==='device'?'active':''}">▣ 授权设备适配器（模拟）</button></div>${s.runMode==='manual'?`<div class="form-line"><label for="operatorName">记录的执行人（演示身份）</label><input type="text" id="operatorName" value="${esc(operatorName)}" maxlength="80"/></div><div class="p-card"><h3>现场核对清单（只为测试交互，不代替真实安全许可）</h3><div class="check-list">${CHECKS.map(([id,text])=>`<label><input type="checkbox" data-check="${id}" ${s.checks[id]?'checked':''}/><span>${esc(text)}</span></label>`).join('')}</div></div>`:`<div class="p-card"><h3>模拟 Device Adapter</h3><p>协议涵盖原料、步骤、参数、停止条件、回流字段。不会发送任何硬件指令。</p><label class="check-list"><span><input type="checkbox" data-device-auth="1" ${s.deviceAuthorized?'checked':''}/> 我理解这只是模拟设备授权及数据回单，没有真实控制设备</span></label></div>`}<div class="warning-line">点击生成回单后将载入演示用虚构结果：A1/A2/A3 指标。禁止作为检验合格证、真实实验记录或直接生产依据。</div><div class="note">当前将生成3个样品的模拟物性数值；食品接触、酒液密封、高低温及回收相容没有真实测试结果。</div>${modal?.error?`<div class="error-line">${esc(modal.error)}</div>`:''}</div><div class="modal-actions">${btn('取消','close')}${btn('生成明确标记的模拟执行回单','confirm-exec','primary')}</div>`;}
function resetModal(){return `<div class="modal-head"><div><div class="eyebrow">RESET / LOCAL DEMO</div><h2>确认重置 V4 演示？</h2></div>${btn('✕','close','mini')}</div><div class="modal-main"><div class="warning-line"><b>建议先导出当前记录。</b><br>重置会清空 V4 的事项进度、Board、工件引用、人工接单、模拟回单和备注，不能撤销；不会触及 V1/V2/V3。</div><p>此操作只影响本地浏览器；不删除或修改 GitHub 项目、源文件或任何真实系统数据。</p></div><div class="modal-actions">${btn('先导出状态','export','')}${btn('取消，保留现状','close')}${btn('确认重置演示','confirm-reset','danger')}</div>`;}
function modalHtml(){if(!modal)return '';let inner=modal.type==='board'?modalBoard(modal.key):modal.type==='members'?membersModal():modal.type==='accept'?acceptModal():modal.type==='exec'?execModal():resetModal();return `<div class="modal-backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${modal.type==='board'?'交接 Board':modal.type==='exec'?'实验执行':modal.type==='accept'?'任务接收':'演示操作'}">${inner}</section></div>`;}
let mainPositions={},lastRenderedKey='';
function render(scroll=false){
 const oldChat=$('chatScroll');if(oldChat){const oldGroup=Number(oldChat.dataset.group);if(Number.isInteger(oldGroup)){chatPositions[oldGroup]=oldChat.scrollTop;chatAtBottom[oldGroup]=oldChat.scrollHeight-oldChat.scrollTop-oldChat.clientHeight<70;}}
 const oldMain=document.querySelector('.main-page');if(oldMain&&lastRenderedKey)mainPositions[lastRenderedKey]=oldMain.scrollTop;
 const main=view==='work'?(workTab==='matters'?conversation():workSecondary()):auxiliary();
 $('app').innerHTML=rail()+`<div class="v5shell">${spaceHeader()}<div class="workspace">${main}${modalHtml()}${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}</div></div>`;
 const newChat=$('chatScroll');if(newChat){newChat.scrollTop=scroll?newChat.scrollHeight:(chatPositions[selected]||0);if(scroll){chatPositions[selected]=newChat.scrollTop;chatAtBottom[selected]=true;}const jump=$('chatJump');if(jump)jump.hidden=newChat.scrollHeight-newChat.scrollTop-newChat.clientHeight<100;}
 const newMain=document.querySelector('.main-page');const nextKey=view+'/'+workTab+'/'+objectIndex+'/'+boardTab;
 if(newMain)newMain.scrollTop=mainPositions[nextKey]||0;lastRenderedKey=newMain?nextKey:'';
}

function showModal(type,key){modal={type,key,error:''};boardChoice=s.boards[key]?.choice||'';render();}
function ensureBoard(key){if(!BOARDS[key])return null;let b=s.boards[key];if(!b){b={status:'draft',choice:'',draftChoice:'',actor:'',origin:E[s.cursor]?.id||'work',version:1,revision:1,acks:[],activity:[{type:'create',actor:'AWiki事项系统（模拟）',text:'根据具体跨主体工作需要创建 Board；尚未形成共同确认。',at:E[s.cursor]?.time||'演示'}]};s.boards[key]=b;save();}b.acks=b.acks||[];b.activity=b.activity||[];b.revision=b.revision||1;return b;}
function createBoard(key){return ensureBoard(key);}
function openBoard(key){const b=ensureBoard(key);if(!b)return;if(view==='work'&&workTab==='matters'){const el=$('chatScroll');boardReturn={group:selected,scrollTop:el?.scrollTop||chatPositions[selected]||0,origin:E[s.cursor]?.id||null,confirmed:false};}else if(!boardReturn){boardReturn={group:BOARD_META[key].originGroup,scrollTop:chatPositions[BOARD_META[key].originGroup]||0,origin:E[BOARD_META[key].originEvent].id,confirmed:false};}
view='work';workTab='resources';resourceFilter='board';search='';objectIndex=Math.max(0,workObjects().findIndex(x=>x.board===key));boardTab='overview';partnerOpen=false;modal=null;setBoardHash(key);render();}
function ackBoard(id,who){const b=s.boards[id],m=BOARD_META[id];if(!b||!m||b.status==='confirmed')return;if(!m.approvers.some(x=>x[0]===who))return;if(!b.draftChoice){notify('请先选择本次交接的结论，再由对应角色模拟签收。');return;}if(!b.acks.includes(who)){b.acks.push(who);b.revision++;b.activity.push({type:'ack',actor:m.approvers.find(x=>x[0]===who)[1],text:'对结论「'+(BOARDS[id].choices.find(x=>x.id===b.draftChoice)?.title||b.draftChoice)+'」模拟签收。不是实际身份验证或数字签名。',at:'本地演示'});}save();render();}
function confirmBoard(){const id=workTab==='resources'?workObjects()[objectIndex]?.board:null,b=s.boards[id],m=BOARD_META[id],d=BOARDS[id];if(!id||!b||!m||b.status==='confirmed')return;if(!b.draftChoice){notify('请先明确选择协作结论。');return;}if(m.approvers.some(x=>!b.acks.includes(x[0]))){notify('双方角色尚未完成模拟签收；不能跳过确认。');return;}b.choice=b.draftChoice;b.status='confirmed';b.actor=m.approvers.map(x=>x[1]).join(' + ')+'（均为模拟）';b.confirmedAt='本地演示';b.frozenVersion=b.version||1;b.revision++;b.activity.push({type:'confirm',actor:'AWiki事项系统（模拟）',text:'双方角色已模拟签收，冻结 V'+b.frozenVersion+' 协作快照，并将确认回单写回来源事项。',at:'本地演示'});s.decisions.push({event:E[s.cursor].id,board:id,choice:b.choice,actors:b.actor});if(id==='spec')s.spec=b.choice;if(boardReturn)boardReturn.confirmed=true;save();notify('已形成 Board 的共同确认快照；可以继续讨论，但不能覆盖冻结版本。');}
function postBoardComment(form){const id=form.dataset.board,b=s.boards[id];if(!b)return;const t=form.querySelector('#boardCommentText')?.value.trim()||'';const type=form.querySelector('#boardCommentType')?.value||'comment';if(t.length<3){notify('请输入至少三个字符的协作内容。');return;}b.revision=(b.revision||1)+1;b.activity=b.activity||[];b.activity.push({type,actor:'张研（本地模拟用户）',text:t,at:'本地演示'});if(type==='change'){b.changeRequests=b.changeRequests||[];b.changeRequests.push({text:t,at:'本地演示',status:'needs_review'});}save();render();const panel=document.querySelector('.board-activity');if(panel)panel.lastElementChild?.scrollIntoView({block:'nearest'});}
function boardLink(id){const url=new URL(window.location.href);url.hash='board='+encodeURIComponent(id);return url.href;}
function copyBoardLink(id){const url=boardLink(id);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>notify('已复制 Board 链接。此演示未实现跨设备共享数据库。')).catch(()=>window.prompt('请复制此链接（本地演示）',url));}else window.prompt('请复制此链接（本地演示）',url);}
function setBoardHash(id){try{const u=new URL(window.location.href);u.hash='board='+encodeURIComponent(id);window.history.replaceState(null,'',u.href);}catch{}}
function clearBoardHash(){try{if(window.location.hash.startsWith('#board=')){const u=new URL(window.location.href);u.hash='';window.history.replaceState(null,'',u.href);}}catch{}}

function confirmAccept(){const t=$('humanReply')?.value.trim()||'';if(t.length<12){modal.error='需要保留清楚、可追溯的任务接收反馈。';render();return;}s.accepted=true;s.notes.push({kind:'group',g:2,text:'王工（模拟具名接单）：'+t});s.decisions.push({event:E[s.cursor].id,type:'human_accept'});save();modal=null;notify('实验员已在本群模拟接单；尚未开始真实实验。');}

function action(name){
 if(name.startsWith('boardtab:')){boardTab=name.split(':')[1];render();return;}
 if(name.startsWith('boardack:')){const [,id,who]=name.split(':');ackBoard(id,who);return;}
 if(name.startsWith('boardreturn')){returnFromBoard();return;}
 if(name.startsWith('boardcopy:')){copyBoardLink(name.split(':')[1]);return;}
 if(name.startsWith('boardpin:')){pinBoardToTopic(name.split(':')[1],name.split(':')[2]);return;}
 if(name.startsWith('boardunpin:')){unpinBoardFromTopic(name.split(':')[1],name.split(':')[2]);return;}
 if(name.startsWith('artifact:')){openArtifact(name.split(':')[1]);return;}
 if(name.startsWith('artifacttab:')){artifactTab=name.split(':')[1];render();return;}
 if(name.startsWith('exportartifact:')){const [,id,fmt]=name.split(':');exportArtifact(id,fmt);return;}
 if(name.startsWith('topic:')){const id=name.split(':')[1];view='work';workTab='topics';objectIndex=Math.max(0,workObjects().findIndex(x=>x.topic===id));search='';render();return;}
 if(name.startsWith('pin:')){const [,topic,id]=name.split(':');if(!artifactReady(id)||ARTIFACTS[id].topic!==topic)return;s.topicPins=s.topicPins||{process:[],experiment:[]};s.topicPins[topic]=s.topicPins[topic]||[];if(!s.topicPins[topic].includes(id))s.topicPins[topic].push(id);save();notify(['result','evaluation','nextplan'].includes(id)?'已收录为模拟案例，不能作为真实实验事实。':'已将工件引用收录到专题，保留原始来源。');return;}
 if(name.startsWith('unpin:')){const [,topic,id]=name.split(':');s.topicPins[topic]=(s.topicPins[topic]||[]).filter(x=>x!==id);save();notify('已撤销专题引用；原工件仍在资源中。');return;}
 if(name==='promote:tc01'){if(!artifactReady('tc01'))return;s.templates=s.templates||[];if(!s.templates.includes('tc01-schema-v1'))s.templates.push('tc01-schema-v1');save();notify('已保存通用任务Schema草案，不包含客户配方或模拟数据；仍需专家审核。');return;}
 if(name==='unpromote:tc01'){s.templates=(s.templates||[]).filter(x=>x!=='tc01-schema-v1');save();notify('已撤销方案模板草案；原任务工件不受影响。');return;}
 if(name==='connections'){view='connections';auxTab='permissions';render();return;}
 if(name==='close' ||name==='hidepartner'){if(name==='close')modal=null;else partnerOpen=false;render();return;}if(name==='showpartner'){partnerOpen=true;render();return;}
if(name==='allresults'){view='work';workTab='resources';resourceFilter='artifact';search='';objectIndex=0;render();return;}if(name==='latest'){const el=$('chatScroll');if(el){el.scrollTop=el.scrollHeight;chatPositions[selected]=el.scrollTop;chatAtBottom[selected]=true;const jump=$('chatJump');if(jump)jump.hidden=true;}return;}if(name==='next'){proceed();return;}if(name==='current'){goCurrent();return;}if(name==='members'){showModal('members');return;}if(name==='pause-hint'){notify('已保留当前状态。尚无确认回单，不会自动推进。');return;}if(name.startsWith('openboard:')){openBoard(name.split(':')[1]);return;}if(name==='confirm-board'){confirmBoard();return;}if(name==='accept-task'){showModal('accept');return;}if(name==='confirm-accept'){confirmAccept();return;}if(name==='execution'){showModal('exec');return;}if(name==='confirm-exec'){confirmExec();return;}if(name==='export'){downloadState();return;}if(name==='reset'){showModal('reset');return;}if(name==='confirm-reset'){s=DEFAULT();save();modal=null;chatPositions={};chatAtBottom={};mainPositions={};boardReturn=null;boardContext=null;artifactTab='summary';resourceFilter='all';objectIndex=0;toast='V4 已从第一条消息重新开始。';goCurrent();return;}
if(name.startsWith('group:')){const i=Number(name.split(':')[1]);if(!s.created.includes(i))return;view='work';workTab='matters';selected=i;render();return;}
if(name.startsWith('sourceevent:')){jumpToEvent(Number(name.split(':')[1]));return;}if(name.startsWith('source:')){view='work';workTab='resources';resourceFilter='all';search='';objectIndex=Math.max(0,workObjects().findIndex(x=>x.source===name.split(':')[1]));render();return;}if(name==='solution'){view='work';workTab='solutions';objectIndex=0;render();return;}
}

<script id="v53-chronology-and-board-guidance">
/* V5.3: display user speech before its metadata, preserve the event-time ordering,
   and provide context-specific private AI partner prompts for Board creation and sign-off.
   This is a deterministic UI simulation, not a remote AI or signing service. */
const v53PreviousRender=render;
function v53PositionGroupNotes(scroll){
 const timeline=document.querySelector('#chatScroll .timeline');
 if(!timeline)return;
 const box=$('chatScroll');const oldTop=box?.scrollTop||0;
 const notes=s.notes.filter(n=>n.kind==='group'&&n.g===selected&&n.id);
 for(const n of notes){
  const node=document.getElementById('group-note-'+n.id);
  if(!node)continue;
  const bubble=node.querySelector('.bubble'),metadata=node.querySelector('.metadata');
  if(bubble&&metadata){bubble.insertAdjacentElement('afterend',metadata);metadata.classList.add('v53-after-meta');}
  // Old V5.2 notes without cursorAt remain at the end rather than inventing a past timestamp.
  if(!Number.isInteger(n.cursorAt)||n.cursorAt<0||n.cursorAt>=E.length)continue;
  let next=null;
  for(let i=n.cursorAt+1;i<=s.cursor;i++){
   if(E[i].g!==selected)continue;
   next=document.getElementById('event-'+E[i].id);
   if(next)break;
  }
  if(next){
   if(next.previousElementSibling?.classList.contains('chapter'))next=next.previousElementSibling;
   timeline.insertBefore(node,next);
  }else{
   const advance=timeline.querySelector('.advance');
   if(advance)timeline.insertBefore(node,advance);
  }
 }
 if(box){
  if(scroll){box.scrollTop=box.scrollHeight;chatPositions[selected]=box.scrollTop;chatAtBottom[selected]=true;}
  else box.scrollTop=oldTop;
  const jump=$('chatJump');if(jump)jump.hidden=box.scrollHeight-box.scrollTop-box.clientHeight<100;
 }
}
function v53BoardNotice(){
 if(view!=='work')return '';
 const isMatter=workTab==='matters'&&selected===E[s.cursor].g;
 const currentObject=workTab==='resources'?workObjects()[objectIndex]:null;
 let id=null;
 if(currentObject?.board)id=currentObject.board;
 else if(isMatter&&E[s.cursor].gate&&BOARDS[E[s.cursor].gate])id=E[s.cursor].gate;
 else if(isMatter){
  const keys=Object.keys(s.boards).filter(k=>BOARD_META[k]?.originGroup===selected&&s.boards[k]?.status!=='confirmed');
  id=keys[0]||null;
 }
 if(!id||!BOARDS[id]||!BOARD_META[id])return '';
 const b=s.boards[id],meta=BOARD_META[id];
 if(b?.status==='confirmed')return '';
 const isEarly=id==='spec'&&s.cursor<2;
 const approvers=meta.approvers||[];
 const myApprovers=approvers.filter(([who])=>roleForSigner(who)===currentRole);
 const pendingMine=myApprovers.filter(([who])=>!(b?.acks||[]).includes(who));
 const installed=Boolean(rolePackInstalled(currentRole));
 const joined=roleSpaceStatus(currentRole)==='joined';
 let title='Board 协作提醒',body='',button='查看共同工作 Board',action='openboard:'+id;
 if(!b){title='建议建立共同 Board';body='当前工作涉及跨主体的事实与责任。可以先创建 Board，明确双方主体、资料范围和后续协作，再决定是否交接。';button='创建并查看 Board';}
 else if(isEarly){title='研发委托 Board 已建立';body='L0 正在对照原始需求与研发建议。你可以先查看共同事实；此时不应要求任何主体提前确认尚未澄清的条件。';}
 else if(!installed||!joined){title='Board 等待你具备协作资格';body=!installed?'当前客户端尚未安装兼容方案包。安装仅获得协同能力，还需要按治理规则加入空间。':'当前客户端尚未加入空间。请先完成空间准入，再按本方授权处理 Board。';button='查看空间准入';action='v5-space-governance';}
 else if(pendingMine.length){title='轮到你确认 Board';body='你在本 Board 中承担「'+pendingMine.map(([who,label])=>label).join('、')+'」的责任。请先阅读事实、版本、共享范围和待确认结论，再决定是否签收；我不会代替你点击。';button='查看本方待确认内容';}
 else if(myApprovers.length){title='本方已确认，等待其他主体';const rest=approvers.filter(([who])=>!(b?.acks||[]).includes(who));body=rest.length?'你的本方确认已记录。当前等待 '+rest.map(([,label])=>label).join('、')+' 独立签收；不会因为你按 N 就替对方确认。':'各方已确认，请核对系统是否已形成冻结快照。';button='查看签收进度';}
 else{title='Board 需要其他主体处理';const rest=approvers.filter(([who])=>!(b?.acks||[]).includes(who));body='你可以查看共同事实和协作记录，但不能代替 '+(rest.length?rest.map(([,label])=>label).join('、'):'指定责任人')+' 签收。';}
 const buttonHtml=action==='v5-space-governance'?'<button type="button" class="btn mini primary" data-action="v5-space-governance">查看空间成员与治理</button>':btn(button,action,'mini primary');
 return `<section class="v53-board-alert" aria-label="AI伙伴 Board 协作提醒"><div class="v53-alert-head"><span class="v53-dot"></span>✦ ${esc(title)}</div><p>${esc(body)}</p><div class="v53-alert-actions">${buttonHtml}</div><small class="v53-alert-status">${esc(BOARDS[id].title)} · 仅对当前用户可见 · 预置规则提示</small></section>`;
}
const v53PreviousPartner=partner;
partner=function(){const html=v53PreviousPartner(),notice=v53BoardNotice();return notice?html.replace('<div class="partner-body">','<div class="partner-body">'+notice):html;};
// Make a private Board reminder discoverable when the AI partner panel is collapsed on mobile.
const v53PreviousMatterHead=matterHead;
matterHead=function(){const html=v53PreviousMatterHead();return v53BoardNotice()?html.replace('✦ AI伙伴','✦ AI伙伴 · 有提醒'):html;};
render=function(scroll=false){v53PreviousRender(scroll);v53PositionGroupNotes(scroll);};
render(true);
</script>

<script id="v54-linked-board-focus">
/* AWiki V5.4 · Board focus linkage: task stays in Matter; partner assists privately.
   No additional signing or authorization capability is introduced by this UI. */
const v54PreviousPartner=v53PreviousPartner;
const v54PreviousRender=render;
let v54ChecklistOpen=false;
function v54BoardContext(){
 if(view!=='work')return null;
 if(workTab==='matters' && selected===E[s.cursor].g){
  const e=E[s.cursor];
  if(e.gate&&BOARDS[e.gate]&&!satisfied(e))return {id:e.gate,kind:'matter'};
 }
 if(workTab==='resources'){
  const o=workObjects()[objectIndex];
  if(o?.board&&BOARDS[o.board])return {id:o.board,kind:'board'};
 }
 return null;
}
function v54Status(ctx){
 const b=s.boards[ctx.id],meta=BOARD_META[ctx.id];
 if(!b)return {title:'待建立共同工件',desc:'当前事项需要跨主体协作。请从左侧任务创建 Board，随后共同维护事实与责任。'};
 if(b.status==='confirmed')return {title:'交接版本已确认',desc:'双方已完成本次确认。冻结的是交接快照，Board 仍可继续协作。'};
 if(!rolePackInstalled(currentRole)||roleSpaceStatus(currentRole)!=='joined')return {title:'先完成空间准入',desc:'安装方案包不等于加入空间。请按治理规则获得成员资格后再处理本方责任。'};
 const mine=(meta?.approvers||[]).filter(([who])=>roleForSigner(who)===currentRole);
 const outstanding=mine.filter(([who])=>!(b.acks||[]).includes(who));
 if(outstanding.length)return {title:'等待你核对与确认',desc:'请先核对共享范围、来源、责任主体及版本，再到左侧 Board 中决定是否确认。'};
 if(mine.length)return {title:'本方已确认，等待其他主体',desc:'你的确认已记录。其他主体必须独立签收，不能由 AI 伙伴或当前用户代替。'};
 return {title:'查看其他主体的协作进展',desc:'可以理解共同事实和讨论，但只有被授权的责任主体才能确认其职责。'};
}
function v54BoardId(id){return 'BOARD-'+id.toUpperCase();}
function v54PartnerCard(ctx){
 const d=BOARDS[ctx.id],status=v54Status(ctx),id=v54BoardId(ctx.id);
 const actionLabel=ctx.kind==='matter'?'↖ 定位左侧 Board 任务':'↖ 定位当前 Board 内容';
 const intro=ctx.kind==='matter'?'右侧是这项任务的私人辅助说明。创建、修改、签收等正式操作只在左侧事项或 Board 中完成。':'我正在辅助你核对当前 Board 的共同事实、版本、参与者和协作责任。';
 return `<section class="v54-focus-card" data-v54-board="${esc(ctx.id)}" aria-label="AI伙伴正在辅助的 Board">
  <div class="v54-focus-eyebrow"><span class="v54-focus-dot"></span>✦ AI 伙伴 · 与左侧工作对象同步</div>
  <span class="v54-focus-id">${esc(id)}</span><h3>${esc(d.title)}</h3>
  <span class="v54-status">${esc(status.title)}</span><p>${esc(status.desc)}</p>
  <p>${esc(intro)}</p>
  <div class="v54-focus-actions"><button type="button" data-v54="locate">${actionLabel}</button><button type="button" data-v54="checklist" aria-expanded="${v54ChecklistOpen}">${v54ChecklistOpen?'收起核对要点':'核对要点 ▾'}</button></div>
  <div class="v54-checklist" ${v54ChecklistOpen?'':'hidden'}>
   <ul><li><b>工作对象：</b>${esc(d.title)}；ID ${esc(id)}</li>
   <li><b>共享范围：</b>${esc(d.scope)}</li>
   <li><b>来源依据：</b>${esc(d.source)}</li>
   <li><b>责任主体：</b>${esc((BOARD_META[ctx.id]?.approvers||[]).map(x=>x[1]).join('、')||'按 Board 规则')}</li>
   <li><b>操作边界：</b>私人建议不会发送给群，也不构成签名、授权或验收。</li></ul>
  </div><p class="v54-focus-note">同一 Board ID · 左侧负责工作 · 右侧仅作私人辅助 · 全部为本地模拟</p>
 </section>`;
}
partner=function(){
 const html=v54PreviousPartner(),ctx=v54BoardContext();
 return ctx?html.replace('<div class="partner-body">','<div class="partner-body">'+v54PartnerCard(ctx)):html;
};
function v54Decorate(){
 const ctx=v54BoardContext();if(!ctx)return;
 const body=document.querySelector('.partner-body');
 if(body){
  // Keep background guidance available, but make the task-specific guidance primary.
  const extras=[...body.children].filter(el=>el.classList.contains('p-card'));
  const details=document.createElement('details');details.className='v54-context-details';
  const summary=document.createElement('summary');summary.textContent='其他工作背景、授权与私人笔记';details.appendChild(summary);
  for(const el of extras){
   // Do not expose a second Board creation/signing button in the AI partner.
   el.querySelectorAll('[data-action^="openboard:"]').forEach(btn=>btn.remove());
   details.appendChild(el);
  }
  if(extras.length)body.insertBefore(details,body.querySelector('.v52-partner-cta')||null);
 }
 if(ctx.kind==='matter'){
  const gate=document.querySelector('#chatScroll .timeline>.advance:last-child');
  if(gate){
   gate.id='v54-task-anchor';gate.classList.add('v54-linked-task');gate.dataset.v54Board=ctx.id;
   gate.insertAdjacentHTML('afterbegin',`<div class="v54-task-meta"><span class="v54-task-id">${esc(v54BoardId(ctx.id))}</span><span class="v54-task-assist">AI 伙伴正在辅助这项工作</span></div>`);
  }
 }else{
  const board=document.querySelector('.board-workspace');
  if(board){board.id='v54-board-anchor';board.classList.add('v54-workspace-selected');}
 }
}
function v54Pulse(el){if(!el)return;el.classList.remove('v54-pulse');void el.offsetWidth;el.classList.add('v54-pulse');}
function v54Locate(){
 const ctx=v54BoardContext();if(!ctx)return;
 const el=document.getElementById(ctx.kind==='matter'?'v54-task-anchor':'v54-board-anchor');
 if(!el)return;
 const scroller=ctx.kind==='matter'?document.getElementById('chatScroll'):document.querySelector('.main-page');
 if(scroller){
  const rect=el.getBoundingClientRect(),parent=scroller.getBoundingClientRect();
  const delta=rect.top-parent.top-Math.max(16,(scroller.clientHeight-Math.min(rect.height,scroller.clientHeight))/2);
  scroller.scrollTop+=delta;
  if(ctx.kind==='matter'){chatPositions[selected]=scroller.scrollTop;chatAtBottom[selected]=false;}
 }
 v54Pulse(el);
}
render=function(scroll=false){
 v54PreviousRender(scroll);v54Decorate();
 // Layout grows when the shared-ID strip is inserted: finish scrolling after decoration.
 if(scroll&&v54BoardContext()?.kind==='matter'){const box=document.getElementById('chatScroll');if(box){box.scrollTop=box.scrollHeight;chatPositions[selected]=box.scrollTop;chatAtBottom[selected]=true;const jump=document.getElementById('chatJump');if(jump)jump.hidden=true;}}
};
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-v54]');
 if(btn){
  if(btn.dataset.v54==='locate')v54Locate();
  if(btn.dataset.v54==='checklist'){
   v54ChecklistOpen=!v54ChecklistOpen;
   const panel=btn.closest('.v54-focus-card')?.querySelector('.v54-checklist');
   if(panel)panel.hidden=!v54ChecklistOpen;
   btn.textContent=v54ChecklistOpen?'收起核对要点':'核对要点 ▾';
   btn.setAttribute('aria-expanded',String(v54ChecklistOpen));
  }
  return;
 }
 const task=e.target.closest('.v54-linked-task');
 if(task&&!e.target.closest('button,a,input,select,textarea')){
  const partnerBody=document.querySelector('.partner-body');
  if(partnerBody)partnerBody.scrollTop=0;
  v54Pulse(document.querySelector('.v54-focus-card'));
 }
},true);
render(true);

</script>

 if(currentRole==='reviewer')return '我是周博士的私人 AI 伙伴。你以材数智元内部专家身份复核 L7 结果的证据性质、缺失测试和下一轮建议。你可以独立签收专业复核，但不能代替项目负责人张研确认项目交接，也不能替实验室王工接受实验任务。';

let v55SigningInProgress=false;

ackBoard=function(id,who){
 const b=s.boards[id],m=BOARD_META[id],expected=roleForSigner(who);
 if(!b||!m||b.status==='confirmed'||!m.approvers.some(x=>x[0]===who))return;
 if(currentRole!==expected){notify('签收主体不匹配：请切换到 '+(V5_ROLE[expected]||expected)+' 的独立模拟客户端。');return;}

 if(!roleAllowedBoard(id)){notify('当前人员没有此 Board 的授权访问范围。');return;}
 if(who==='quality'&&id!=='result-handoff'){notify('周博士只承担 L7 专业复核职责。');return;}
 if(!b.draftChoice){notify('请先确定本次交接的结论和版本。');return;}
 if(b.acks?.includes(who)){notify('此身份已签收，不能重复签收。');return;}
 const proposal={space:activeSpace,board:m.uid,boardVersion:b.version||1,choice:b.draftChoice,governanceVersion:activeMeta().policyVersion};
 const proposalText=JSON.stringify(proposal);
 if(b.v55Proposal&&b.v55Proposal!==proposalText){notify('待签收的版本或结论已经变化，请重新发起本轮签收。');return;}
 if(!b.v55Proposal)b.v55Proposal=proposalText;
 const count=b.activity?.length||0;
 v55SigningInProgress=true;
 try{v55OldAck(id,who);}finally{v55SigningInProgress=false;}
 if(!(b.acks||[]).includes(who))return;
 b.v55Audit=b.v55Audit||{};
 b.v55Audit[who]={person:currentRole==='reviewer'?'person:research:zhou':currentRole==='research'?'person:research:zhang':currentRole==='lab'?'person:lab:wang':'person:client:li',organization:orgOfPerson(currentRole),role:who,space:activeSpace,boardVersion:proposal.boardVersion,choice:proposal.choice,governanceVersion:proposal.governanceVersion,pack:'awiki.materials-research@1.0',simulation:true};
 const entry=(b.activity||[]).slice(count).find(x=>x.type==='ack');
 if(entry){entry.actor=V5_ROLE[currentRole]+'（独立个人身份 · 模拟）';entry.identity=b.v55Audit[who];}
 // V5.1 attempted auto-confirm before this identity audit existed. Retry only after both personal audits are present.
 if(m.approvers.every(([key])=>b.acks.includes(key)))confirmBoard();
 save();render();
};
const v55OldConfirm=confirmBoard;
confirmBoard=function(){
 const id=workTab==='resources'?workObjects()[objectIndex]?.board:null,b=s.boards[id],m=BOARD_META[id];
 if(!id||!b||!m||v55SigningInProgress)return;
 if(m.approvers.every(([who])=>(b.acks||[]).includes(who))){
  const proposal=JSON.stringify({space:activeSpace,board:m.uid,boardVersion:b.version||1,choice:b.draftChoice,governanceVersion:activeMeta().policyVersion});
  if(b.v55Proposal!==proposal||m.approvers.some(([who])=>b.v55Audit?.[who]?.choice!==b.draftChoice||b.v55Audit?.[who]?.boardVersion!==(b.version||1))){notify('缺少针对同一版本和结论的个人签收，不能冻结快照。');return;}
 }
 return v55OldConfirm();
};
const v55OldDecision=boardDecisionSection;
boardDecisionSection=function(id){
 const html=v55OldDecision(id);
 if(id!=='result-handoff')return html;
 const b=s.boards[id];
 const state=who=>b?.v55Audit?.[who]?'已由个人身份模拟确认':'尚未由该个人确认';
 const note=`<div class="v55-review-audit"><b>同一机构、不同个人职责</b><p>周博士：专业复核 · ${state('quality')}</p><p>张研：项目交接与下一轮安排 · ${state('user')}</p><p>继承材数智元组织的方案包与空间资格；个人确认不可互相代签。全部为本地模拟。</p></div>`;
 return html.replace('</section>',note+'</section>');
};
document.addEventListener('change',e=>{
 if(e.target.name==='board-choice'){const b=s.boards[e.target.dataset.board];if(b&&b.draftChoice!==e.target.value){delete b.v55Proposal;delete b.v55Audit;}}
},true);
const v55PriorRender=render;
render=function(scroll=false){
 if(currentRole==='reviewer'&&view==='work'&&workTab==='matters'&&!workObjects().some(x=>x.group===selected)){workTab='topics';spacePanelTab='overview';}
 v55PriorRender(scroll);
};
render(true);
</script>
