function stop(){clearInterval(timer);timer=null;}
function send(type,extra={}){state=reduce(state,{type,actor:role,version:state.version,operation_id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),...extra});save();if(gate(state))stop();render();}
function sourceView(){return `<p><a href="awiki-pet-research-design.html">框架核验：SIDE非线性能力、有效角色、Task与Matter/AIC</a></p><p>正文已与项目附件提取文本交叉核对；以下为必要摘录与映射，不包含原附件或会话全文。SHA256由本会话根线程Codex在Windows复算，云端按记录引用，未独立复算。图片及版式未核验。</p>`+sources.map(s=>`<article><h3>${s.id} · ${s.name}</h3><blockquote>${esc(s.quote)}</blockquote><p>${esc(s.note)}</p><small>根线程Codex复算SHA256（云端引用）</small><code>${s.hash}</code></article>`).join('');}
function matrix(){return `<p>来源方案建议：8组聚合样品 + 3组对照。A2低锑/非锑是对照变体，不新增第9组。</p><div class="table-wrap"><table><thead><tr><th>样品</th><th>来源变量</th><th>定位与执行卡</th></tr></thead><tbody>${samples.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}<br><small>${i<3?'TC-01 · 待实验专家确认':'详细卡待补'}</small></td></tr>`).join('')}</tbody></table></div>`;}
function resultView(){return `<p class="alert">所有数值都是演示数据，不能证明物性、食品接触合规、密封或回收达标。</p>${state.results.length?state.results.map(r=>{
 if(!r.valid)return `<article class="alert"><h3>${r.sample} · v${r.version} · 异常隔离</h3><p>${esc(r.isolation_reason||'测量质量异常，证据不可信')}</p><p>禁止用于指标评价、候选保留或下一轮建议。请重新采集并确认测量。</p><small>隔离证据：${r.evidence} · ${r.origin} · 模拟</small></article>`;
 if(r.version!==state.version)return `<article><h3>${r.sample} · v${r.version} · 只读历史</h3><p>原基线 ${r.baseline}；当前任务v${state.version}。历史数据不参与当前指标评价或下一轮建议。</p>${json({values:Object.fromEntries(metrics.map(m=>[m[1]+' '+m[3],r[m[0]]])),evidence:r.evidence,origin:r.origin,demo:true})}</article>`;
 return `<article><h3>${r.sample} · v${r.version} · ${r.baseline} ${badge('当前版本有效（模拟）')}</h3><p>${r.origin}</p><div class="table-wrap"><table><tr><th>指标</th><th>值</th><th>S1阈值</th><th>演示比较</th></tr>${metrics.map(m=>`<tr><td>${m[1]}</td><td>${r[m[0]]} ${m[3]}</td><td>${m[2]}</td><td>${evaluate(r)[m[0]]?'范围内':'未满足'}</td></tr>`).join('')}</table></div><p>建议：${r.sample==='A3'?'降低软段并复查维卡、硬度及尺寸；暂停该风险配方。':r.sample==='D1'?'优先补齐D1实验卡，复测尺寸稳定性。':'保留A2候选，补充迁移/密封与尺寸实测。'}</p><small>${r.evidence} · 原始证据为模拟</small></article>`;
 }).join(''):'尚无测量。'}`;}
function board(){return `<div class="board-grid"><article><h3>需求基线 ${badge('v'+state.version)}</h3><p>${state.baseline||'争议未解决'} · ${state.baseline==='S1'?'50℃/-24℃ 各24h；次数待明确':state.baseline==='S2'?'60℃/-20℃ 各24h；三次循环':'原始与V0.2冲突'}</p>${btn('查看两份证据','panel','来源')}${btn('按角色处理温度争议','panel','SIDE 能力活动')}<p><b>提议变更温度条件 / 重新客户确认</b><br>客户角色选择下方来源；变更将使旧批准失效，保留旧确认历史：</p>${btn('采用原始S1','baseline','S1')}${btn('采用V0.2','baseline','S2')}${btn('请求澄清','baseline','clarify')}</article><article><h3>指标</h3>${metrics.map(m=>`<p>${m[1]} ${m[2]} ${m[3]}<small>${m[4]}</small></p>`).join('')}<p>卫生/重金属/塑化剂：来源列GB 4806.7-2023、GB 31604.49-2023、GB 31604.30-2025、GB/T9685；仅来源转录，未做标准适用性核验。</p></article><article><h3>方案与执行卡</h3><p>PET硬段 + 软段 + 低锑/非锑 + 结晶调控</p>${btn('TC-01建议窗口','card')}${btn('8+3样品矩阵','panel','样品矩阵')}</article><article><h3>SIDE活动 / 结果 / 下一轮</h3>${btn('查看非线性SIDE处理记录','panel','SIDE 能力活动')}<p>${state.results.length}份演示结果 · ${state.nextApproved?'下一轮已在Demo批准':'下一轮待负责人批准'}</p>${btn('查看评价','panel','结果')}${btn('版本与争议','panel','版本')}</article></div>`;}
function timeline(){return `<article class="intro"><span class="eyebrow">MATTER PET-01 · 唯一共享总信息线</span><h2>让一次材料研发，形成可交接的闭环</h2><p>客户、材数智元与实验室在同一事项协作。科研任务树组织阶段依赖，SIDE按事件和有效角色形成任务并选择能力，Board保存有版本的共同结论，私人伙伴帮助你判断。</p><div class="chips">${badge('人机混合群')}${badge('CaiMat-L1 · 提供方声明')}${badge('20亿材料数据 · 未实接')}</div></article><article class="alert"><b>温度条件存在来源冲突</b><p>S1：50℃ / -24℃；S2：60℃ / -20℃，3次循环。默认未解决；Demo选择不等于真实客户确认。</p>${btn('查看来源','panel','来源')}</article>${state.events.map(e=>`<article class="event ${e.kind}"><div class="event-head"><b>${esc(e.data.speaker||e.role)}</b><small>${e.id} · L${e.stage} · v${e.version}</small></div>${badge(({accepted:'接受/回单',proposed:'提议',rejected:'拒绝',disputed:'争议/异常',superseded:'被替代',note:'群内本地备注'})[e.kind])}${e.data.title?`<h3>${esc(e.data.title)}</h3>`:''}<p>${esc(e.text)}</p>${e.data.contract?btn('工件：'+esc(e.data.artifact)+' · 查看输入/输出','event',e.id):''}<details><summary>回单与来源 JSON</summary>${json(e)}</details></article>`).join('')}<article><label>普通群内本地备注<textarea id="group-note" placeholder="讨论记录，不构成决定或授权"></textarea></label>${btn('发送本地备注','group-note')}</article>`;}
function controls(){const g=gate(state);return `<section class="decision"><span class="eyebrow">当前关口 · ${g||'可推进'}</span><h3>L${state.stage} ${stages[state.stage]}</h3><label>模拟会话主体 / 已绑定角色<select id="role">${Object.entries(actors).map(([k,v])=>`<option value="${k}" ${role===k?'selected':''}>${v}</option>`).join('')}</select></label><p class="hint">切换的是预置模拟会话主体；绑定须仍有效，候选角色不扩权。非真实身份认证。</p>${!state.baseline?`${btn('采用原始 S1','baseline','S1','primary')}${btn('采用 V0.2 S2','baseline','S2')}${btn('请求客户澄清','baseline','clarify')}`:''}${[3,5,7].includes(state.stage)&&!state.nextApproved?btn(state.stage===7?'批准下一轮建议':'批准当前版本 v'+state.version,'approve','','primary'):''}${state.nextApproved?`<p class="alert">本轮完成 · 批准已绑定L7@v${state.version}</p>${btn('创建下一轮提案 → 专家重审','next-round','','primary')}`:''}${state.stage===6?`<p>${state.mode==='human'?['AI已生成操作/采集卡 → 等实验员接受','已接受 → 等操作回执','已操作 → 等测量确认'][state.step]:'设备模式：仅TC-01，适配层检查后模拟执行'}</p>${btn(state.mode==='device'?'模拟设备执行':state.step===0?'实验员接受卡':'提交操作回执','execute','','primary')}<label>演示测量样品<select id="sample"><option>A2</option><option>A3</option><option>D1</option></select></label>${btn('载入并确认演示测量','measure')}${btn('注入异常测量','anomaly')}`:''}${btn('拒绝提议','reject')}${btn('修订并重新送审','revise')}<p>确认绑定当前版本与操作者；旧版本永久保留。批准工艺仅指本地模拟，不是实用工艺认证。</p></section>`;}
function sideView(){return `<h2>SIDE · 非线性协作能力面</h2><p>先选择共享事件，在有效绑定内确定活动角色并形成Task；再选择能力。可随时往返，不固定对应L等级，也不是四步流程。</p><article><h3>1. 从同一事件形成角色相关任务</h3><label>输入事件<select id="side-event"><option value="INPUT-REQ">S1/S2 原始温度争议</option>${state.events.map(e=>`<option value="${e.id}">${e.id} · v${e.version} · ${esc(e.text.slice(0,45))}</option>`).join('')}</select></label><label>调用点建议的活动角色（不授予角色）<select id="side-role">${Object.entries(actors).map(([k,v])=>`<option value="${k}" ${role===k?'selected':''}>${v}</option>`).join('')}</select></label><p>当前主体：${principals[role]} · ${validBinding(state,role)?'有效绑定':'无有效绑定 / 仅候选'}</p>${btn('解释事件并形成Task','side-task','','primary')}</article><article><h3>2. 为已形成的Task选择能力</h3><select id="side-task-id">${state.sideTasks.map(t=>`<option value="${t.id}" ${sideTaskId===t.id?'selected':''}>${t.id} · v${t.version} · ${t.active_role||'候选:'+t.candidate_role} · ${esc(t.meaning)}</option>`).join('')}</select><div class="stages">${Object.entries(sideCapabilities).map(([k,c])=>btn(k+' · '+c.name,'side-run',k)).join('')}</div><p>每次调用重新核对任务版本、角色绑定和独立授权。D只生成澄清提议，不自动确认客户条件，不控制设备。</p>${btn('客户回到需求Board确认','panel','Board')}</article><article><h3>角色与授权边界测试</h3><p>负责人可模拟撤销/到期，再切换到目标主体尝试执行。角色有效不代表动作授权有效。</p><select id="binding-target">${['technician','expert','agent','customer'].map(a=>`<option value="${a}">${actors[a]}</option>`).join('')}</select>${btn('令角色到期','role-state','expired')}${btn('撤销角色绑定','role-state','revoked')}${btn('仅撤销独立动作授权','grant-state')}<details><summary>模拟正式绑定与独立授权</summary>${json({bindings:state.roleBindings,grants:state.grants})}</details></article><h3>Board · 能力活动（按发生顺序，不强制顺序）</h3>${state.sideActivities.map(a=>`<article><h3>${a.id} · ${a.capability} ${a.name}</h3>${badge(a.permission.allowed?'授权范围内处理':'拒绝执行')}<p>${esc(a.permission.reason)}</p><details><summary>输入证据 / 角色绑定 / Task / 权限 / 回单</summary>${json(a)}</details></article>`).join('')}<details><summary>任务指纹与角色依据</summary>${json(state.sideTasks)}</details><details><summary>AIC · 当前有效语义与来源索引</summary>${json(aic(state))}</details><details><summary>环境说明版本</summary>${json(environment)}</details>${state.migration.length?'<p>旧版TREE日志仅归档，未转换成SIDE批准或活动。</p>':''}`;}
function mainContent(){if(view==='连接')return `<h2>参与者与跨域身份</h2>${Object.values(actors).map(x=>`<article>${x}</article>`).join('')}${json(identities)}`;
if(view==='AWiki')return `<h2>能力与方案发现</h2><article><h3>材数智元 · CaiMat-L1</h3><p>提供方声明的底座模型与20亿材料数据背景。此Demo没有调用模型或数据库。</p></article><article><h3>科研协同方案包</h3><p>安装概念：阶段契约、角色、Board模板与实验适配规则。目录可见不等于授权。</p>${btn('查看契约','panel','科研任务树 / 契约')}</article>`;
if(view==='概况')return `<h2>事项概况</h2>${board()}`;
if(view==='消息')return `<h2>消息入口</h2><article>科研人机混合群 · PET-01<p>普通消息不自动成为决定；同一事项只维护一条逻辑共享总信息线。</p>${btn('进入事项共享线','panel','时间线')}</article>`;
if(tab==='资源')return sourceView();if(tab==='专题')return `<h2>研究专题</h2><article>软段比例与维卡 / 结晶动力学 / 食品接触风险<p>来源S2的研究假设；等待真实文献、实验与专家评审，不伪造检索结果。</p></article>${resultView()}`;if(tab==='方案')return `<h2>方案包 · PET首轮验证</h2>${json(card)}${matrix()}`;
if(panel==='SIDE 能力活动')return sideView();
if(panel==='Board')return board();if(panel==='来源')return sourceView();if(panel==='样品矩阵')return matrix();if(panel==='结果')return resultView();if(panel==='版本')return `<h2>不可变版本与确认记录</h2><p>母板引用绑定版本；新版本不会改写已有结果或旧确认。</p>${state.events.filter(e=>['accepted','rejected','disputed','superseded','proposed'].includes(e.kind)).map(e=>`<article>${badge(e.kind)} v${e.version} · ${esc(e.text)}${json({actor:e.actor,role:e.role,operation_id:e.operation_id,sources:e.sources})}</article>`).join('')}`;
if(panel==='科研任务树 / 契约')return `<h2>科研任务树 · L0–L7依赖</h2><p>这是科研阶段依赖，不是SIDE能力顺序。任意阶段可基于共享事件和有效角色形成任务，选择SIDE能力，引用同一Board、工件、决定与回单。</p><div class="stages">${stages.map((n,i)=>btn('L'+i+' '+n,'stage',i,i===selected?'active':'')).join('')}</div>${json(contract(state,selected))}`;
if(panel==='执行与授权')return `<h2>L6 执行边界</h2><p>全部模拟；未连接设备。当前路径：${state.mode==='human'?'实验员':'设备'}</p>${btn('切换实验员模式','mode','human')}${btn('切换设备模式','mode','device')}<article><h3>专家配置（变更即失效旧批准）</h3><label>缩聚模拟设定温度 ℃ <input id="temperature" type="number" value="${state.config.temperature}"></label><label><input id="calibration" type="checkbox" ${state.config.calibrated?'checked':''}>校准有效</label>${btn('保存配置并重新送审','config')}</article><article><h3>跨域拒绝测试</h3>${btn('越权查客户配方','query','private')}${btn('错误 audience','query','audience')}${btn('撤销授权','revoke','','danger')}<p>撤销后不能通过修订/重试恢复执行。重置仅开始新的本地演示。</p></article>${json(identities)}<h3>配置Matter · 差异、影响、批准与发布回单</h3>${json(state.configMatter)}${json(card)}`;
return timeline();}
function render(){const focus=document.activeElement?.dataset?.action;document.getElementById('root').innerHTML=`<div class="app"><nav class="rail" aria-label="主导航"><div class="logo">A<span>WIKI</span></div>${['消息','概况','连接','AWiki','工作'].map((v,i)=>btn(['◌','◫','⌘','◎','▣'][i]+'<span>'+v+'</span>','view',v,view===v?'active':'')).join('')}<a href="awiki-pet-research-design.html">设计说明 ↗</a></nav><aside class="list"><header><span class="eyebrow">材数智元 × AWIKI</span><h2>科研工作空间</h2><p>材料研发 · 共同工件</p></header><div class="tabs">${['事项','资源','专题','方案'].map(t=>btn(t,'tab',t,t===tab?'active':'')).join('')}</div><button class="matter" data-action="panel" data-value="时间线"><b>PET 聚酯弹性体</b><small>酒包装内盖 / 内塞 · 人机混合群</small><span class="progress"><i style="width:${(state.stage+1)/8*100}%"></i></span><small>L${state.stage} · ${gate(state)?'等待处理':'进行中'} · v${state.version}</small></button><div class="list-body"><p class="eyebrow">同一事项 · 不同视图</p>${['时间线','Board','SIDE 能力活动','科研任务树 / 契约','样品矩阵','结果','执行与授权','来源','版本'].map(p=>btn(p,'panel',p,panel===p?'active':'')).join('')}<h3>参与者 / Agent</h3><p>客户代表 · 项目负责人<br>实验专家 · 实验员<br>总控 / L0–L7 Agent</p><small>三域：客户 / 材数智元 / 实验室<br>私人伙伴不属于共享群。</small></div></aside><main><header class="main-head"><div><span class="eyebrow">PET-01 / RESEARCH MATTER</span><h1>PET 聚酯弹性体研发</h1><p>一个事项，一条共享总信息线</p></div>${badge('全流程模拟')}</header><div class="toolbar">${btn('单步 →','next')}${btn(timer?'暂停播放':'自动播放','play','','primary')}${btn('导出事件/回单','export')}${btn('重放校验','replay')}${btn('重置','reset')}<small>N / → 单步</small></div><div role="status" class="notice">${esc(warning||('当前 v'+state.version+' · '+(state.revoked?'已撤销':state.nextApproved?'本轮完成':gate(state)?'人工关口：'+gate(state):'可以推进')))}</div><section class="content">${mainContent()}</section></main><aside class="partner"><header><span class="eyebrow">PRIVATE WORKLINE</span><h2>✦ 你的 AI 伙伴</h2><p>私人建议 · 不自动发到群里</p></header><div class="partner-body">${controls()}<article class="private"><h3>给你的判断</h3><p>${esc(state.nextApproved?'本轮已关闭。创建下一轮提案后，先规划，再由专家重审；旧批准不延续。':stageMessages[state.stage].advice)}</p>${btn('明确发布为群提议','publish')}<label>私人备注<textarea id="note" placeholder="仅保存在私人工作线"></textarea></label>${btn('保存私人备注','private')}${state.privateNotes.map(n=>`<p>${esc(n.text)}</p>`).join('')}</article><small>ANP-ready / OVAIM语义演示。JSON是业务载体，不是授权凭据。</small></div></aside></div><dialog id="dialog"><h2>TC-01 · 来源建议</h2><p>待实验专家确认；不等于验证工艺。</p>${json(card)}<form method="dialog"><button>关闭</button></form></dialog>`;
if(focus)document.querySelector(`[data-action="${focus}"]`)?.focus({preventScroll:true});}
document.addEventListener('change',e=>{if(e.target.id==='role'){sideTaskId=document.getElementById('side-task-id')?.value||sideTaskId;role=e.target.value;render();}if(e.target.id==='side-task-id')sideTaskId=e.target.value;});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
if(a==='view'){view=v;render();return;}if(a==='tab'){view='工作';tab=v;render();return;}if(a==='panel'){view='工作';tab='事项';panel=v;render();return;}if(a==='stage'){selected=Number(v);render();return;}if(a==='event'){const event=state.events.find(x=>x.id===v);const dialog=document.getElementById('dialog');dialog.innerHTML='<h2>'+esc(event.data.artifact)+'</h2><p>事件绑定快照 · v'+event.version+' · 来源建议/模拟</p>'+json(event.data.contract)+'<form method="dialog"><button>关闭</button></form>';dialog.showModal();return;}
if(a==='card'){document.getElementById('dialog').showModal();return;}
if(a==='reset'){stop();if(confirm('清除本地演示状态？建议先导出事件。')){state=initial();save();render();}return;}
if(a==='play'){if(timer)stop();else if(!gate(state)&&state.stage<7){timer=setInterval(()=>send('next',{actor:'agent'}),1000);}render();return;}
if(a==='export'){const data={schema:2,migration:state.migration,commands:state.commands.filter(c=>c.type!=='private'),events:state.events,results:state.results,side_tasks:state.sideTasks,side_activities:state.sideActivities,aic:aic(state),configuration_matter:state.configMatter,contracts:stages.map((_,i)=>contract(state,i)),notice:'全为模拟，不含私人备注；重新导入未实现'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='pet-research-events.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
if(a==='replay'){state=restore(JSON.stringify({schema:2,migration:state.migration,commands:state.commands}));warning='已从命令日志重放；版本与授权重新校验。';save();render();return;}

if(a==='role-state'||a==='grant-state'){send(a,{target:document.getElementById('binding-target').value,state:v});return;}

if(a==='baseline')send(a,{choice:v});else if(a==='mode')send(a,{mode:v});else if(a==='config')send(a,{temperature:Number(document.getElementById('temperature').value),calibrated:document.getElementById('calibration').checked});else if(a==='execute')send(a,{audience:'lab-adapter',resource:'TC-01',action:'simulate',purpose:'PET首轮验证'});else if(a==='measure'||a==='anomaly')send('measure',{sample:document.getElementById('sample').value,anomaly:a==='anomaly'});else if(a==='query')send(a,{resource:v==='private'?'customer-formula':'TC-01',audience:v==='audience'?'wrong':'lab-adapter'});else send(a);

document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;if(['n','N','ArrowRight'].includes(e.key)){e.preventDefault();send('next',{actor:'agent'});}});
